services:
  - type: web
    name: novelgenerator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn api.server:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120 --limit-concurrency 10
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: HOST
        value: 0.0.0.0
      - key: NOVELS_DIR
        value: /var/data/novels
      - key: WECHAT_APP_ID
        sync: false
      - key: WECHAT_APP_SECRET
        sync: false
      - key: WECHAT_SESSION_SECRET
        sync: false
      - key: WECHAT_SESSION_TTL_SECONDS
        value: "604800"
      - key: DAILY_CHAPTER_JOB_LIMIT
        value: "20"
      - key: DAILY_TOKEN_LIMIT
        value: "80000"
      - key: MAX_ACTIVE_JOBS_PER_OWNER
        value: "2"
      - key: GENERATION_TIMEOUT_SECONDS
        value: "900"
      - key: JOB_RECOVERY_STALE_SECONDS
        value: "900"
      - key: WECHAT_PRIVACY_VERSION
        value: "v1"
      - key: PRIVACY_POLICY_URL
        sync: false
      - key: MAX_REQUEST_BYTES
        value: "1000000"
    disk:
      name: novel-storage
      mountPath: /var/data
      sizeGB: 1
