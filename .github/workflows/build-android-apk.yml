name: Build NovelGenerator v5 Android APK

on:
  push:
    branches: [v5-rebuild]
  workflow_dispatch:

jobs:
  test-and-build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13 (Chaquopy build Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies & run v5 test suite
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall -q backend run.py tests
          python -m unittest discover -s tests -v

      - name: Sync v5 backend & frontend into Android Chaquopy bundle
        run: |
          python -c "import shutil, pathlib; p = pathlib.Path('android/app/src/main/python'); shutil.rmtree(p / 'backend', ignore_errors=True); shutil.rmtree(p / 'frontend', ignore_errors=True); shutil.copytree('backend', p / 'backend'); shutil.copytree('frontend', p / 'frontend')"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android ARM64 Debug APK
        env:
          CI: "true"
          CHAQUOPY_BUILD_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovelGenerator-v5.0.0-arm64-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
