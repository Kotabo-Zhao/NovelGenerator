name: Build Android APK (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13 (Chaquopy build Python)
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify sync & Python syntax
        run: |
          python -m compileall -q backend android/app/src/main/python
          python tools/sync_frontend.py --check
          python tools/sync_android_core.py --check

      - name: Accept Android SDK licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build Android ARM64 Debug APK
        env:
          CI: "true"
          CHAQUOPY_BUILD_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovelGenerator-v4.6.0-arm64-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
