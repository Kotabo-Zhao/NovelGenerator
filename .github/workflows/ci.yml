name: Source and runtime regressions
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q backend android/app/src/main/python
      - run: ruff check backend --select F821,F811
      - run: python -m pytest -q
      - run: node tests/frontend_runtime.test.cjs
      - run: python tools/sync_frontend.py --check
      - run: python tools/sync_android_core.py --check
