        </div>
        <div v-if="isRegenerating" class="create-progress mb-12">
          <div class="cp-bar"><div class="cp-fill" :style="{width:createProgress+'%'}"></div></div>
          <div class="cp-info"><span class="cp-label">{{ createPhaseLabel }}</span><span class="cp-pct">{{ createProgress }}%</span></div>
        </div>

        <div class="chapter-picker">
          <div v-for="ch in availableChapters" :key="ch" class="cp-btn" :class="{active:ch===writing.chapter, done:(activeNovel.state.completed_chapters||[]).includes(ch)}" @click="!isBusy && selectChapter(ch)" :style="isBusy?{opacity:.4,cursor:'not-allowed'}:{}">{{ ch }}</div>
        </div>

        <div v-if="currentOutline" class="chapter-outline">
          <div class="co-label">大纲</div>
          <div class="co-title">{{ currentOutline.title }}</div>
          <div class="co-summary">{{ currentOutline.summary }}</div>
          <div class="co-meta"><span>🎭 {{ currentOutline.emotion_curve }}</span><span>👤 {{ (currentOutline.characters||[]).join('、') }}</span></div>
        </div>

        <button class="btn btn-primary mb-12" style="padding:10px 24px;font-size:14px" v-if="!writing.done && !(activeNovel.state.completed_chapters||[]).includes(writing.chapter)" @click="doGenerateChapter" :disabled="isBusy">
          <span v-if="loading.write"><span class="spinner"></span> 写作中…</span>
          <span v-else-if="loading.batch">⏳ 批量中…</span>
          <span v-else>✍️ 生成第{{ writing.chapter }}章</span>
        </button>

        <!-- 单章进度条 -->
        <div v-if="loading.write && writing.content" class="chapter-progress">
          <div class="cp-bar"><div class="cp-fill" :style="{width:chapterProgress+'%'}"></div></div>
          <div class="cp-text">{{ chapterProgressLabel || chapterProgress+'%' }}</div>
        </div>

        <!-- 批量生成 -->
        <div class="card mb-16" style="padding:12px 16px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
            <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)">
              <span>批量：从</span>
              <input v-model.number="batchStart" type="number" min="1" :max="activeNovel.state.total_chapters" :disabled="isBusy" style="width:50px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:13px;text-align:center">

              <input v-model.number="batchEnd" type="number" min="1" :max="Math.min(activeNovel.state.total_chapters, batchStart + 9)" :disabled="isBusy" style="width:50px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:13px;text-align:center">
            </div>

              <button v-if="loading.batch" class="btn btn-sm" style="background:var(--red);color:#fff" @click="cancelBatch">⏹ 中断</button>
              <button v-else class="btn btn-secondary btn-sm" @click="doBatchGenerate" :disabled="isBusy">📦 批量生成</button>
            </div>
          </div>
          <div v-if="loading.batch" style="margin-top:8px">
            <div class="batch-status"><div class="progress-bar" style="flex:1"><div class="progress-fill" :style="{width:batchProgress+'%'}"></div></div><span class="progress-text" style="margin-left:8px">{{ batchCurrent }}/{{ batchEnd }} ({{ batchProgress }}%)</span></div>
            <div v-if="batchStatus" style="font-size:12px;color:var(--accent);margin-top:6px">{{ batchStatus }}</div>
            <div v-if="batchStreaming" class="batch-preview">{{ batchStreaming.slice(-300) }}</div>
          </div>
        </div>

        <!-- 写作模式切换 -->
        <div class="mb-16" style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);justify-content:center">
          <span>🐉 网文</span>
          <label class="toggle-switch">
            <input type="checkbox" v-model="writingModeLiterary" @change="onModeChange">
            <span class="toggle-slider"></span>
          </label>
          <span>📖 文学</span>
        </div>
        <!-- v2.3: 原子化生成开关 -->
        <div class="flex items-center gap-8" style="margin-top:8px;font-size:12px;color:var(--text2)">
          <span>📦 标准</span>
          <label class="toggle-switch toggle-sm">
            <input type="checkbox" v-model="useAtomicMode" @change="onModeChange">
            <span class="toggle-slider"></span>
          </label>
          <span>🧬 原子化</span>
          <span class="text-xs color-text3" style="margin-left:4px">逐beat生成 · 高随机性</span>
        </div>

        <div v-if="writing.content" class="chapter-content" ref="preview">{{ writing.content }}</div>
        <div v-else-if="!loading.write && (activeNovel.state.completed_chapters||[]).includes(writing.chapter) && writing.done" class="chapter-empty">
          <div class="ce-icon">☐</div><p>第{{ writing.chapter }}章</p><p class="text-xs color-text3 mt-8">点击章节序号查看</p>
        </div>

        <div v-if="loading.write && !writing.content" class="text-center" style="padding:60px 20px"><div class="spinner" style="width:28px;height:28px"></div><p class="color-text2 mt-16 text-sm">写作中…</p></div>

        <div v-if="writing.done" class="flex gap-8 justify-center mt-24 mb-16">
          <button class="btn btn-primary" @click="nextChapter">下一章</button>
          <button class="btn btn-secondary" @click="copyChapter">复制</button>
          <button class="btn btn-ghost" @click="speakChapter" :disabled="speaking">{{ speaking ? '🔊 朗读中…' : '🔊 朗读' }}</button>
        </div>

        <!-- v2.3.5: 反馈闭环 👍👎 -->
        <div v-if="writing.done" class="review-section" style="border-color:rgba(63,185,80,.25)">
          <div class="rs-title">📊 这章写得怎么样？反馈会让我越写越懂你</div>
          <div class="flex gap-8" style="margin-bottom:8px">
            <button class="btn btn-xs" :class="chapterRating===1?'btn-primary':''" @click="chapterRating=chapterRating===1?0:1">👍 满意</button>
            <button class="btn btn-xs" :class="chapterRating===-1?'btn-danger':''" @click="chapterRating=chapterRating===-1?0:-1">👎 不满意</button>
            <input v-model="chapterReason" placeholder="一句话理由（可选）：节奏太快？对话太少？" style="flex:1;min-height:32px;font-size:13px" :disabled="!chapterRating">
            <button class="btn btn-sm" @click="submitChapterFeedback" :disabled="!chapterRating">提交反馈</button>
          </div>
          <div v-if="chapterFeedbackDone" class="text-xs" style="color:var(--green)">✅ 已记录，感谢反馈！</div>
        </div>

        <!-- 意见重生成 -->
        <div v-if="writing.done" class="review-section">
          <div class="rs-title">💬 对本章不满意？输入修改意见重新生成（大纲和结构不变）</div>
          <textarea v-model="reviewFeedback" rows="2" placeholder="如：对话太少 / 节奏太慢 / 冲突感不够强 / 描写不够细致…"></textarea>
          <button class="btn btn-secondary btn-sm" @click="doRegenerate" :disabled="loading.write || !reviewFeedback.trim()">
            <span v-if="loading.write"><span class="spinner"></span> 重写中…</span>
            <span v-else>🔄 按意见重新生成</span>
          </button>
          <span class="text-xs color-text3 ml-8">大纲、角色、节拍结构均保持不变</span>
        </div>

        <div v-if="error" class="error-msg" style="cursor:pointer" @click="error=''">{{ error }} <span style="float:right;opacity:.5">✕</span></div>
        </div><!-- /writing panel -->

        <!-- v2.3: 剧情图谱面板 -->
        <div v-if="writing.activeTab==='storygraph'" class="storygraph-panel">
          <!-- Loading -->
          <div v-if="sgLoading" class="text-center" style="padding:60px 20px">
            <div class="spinner" style="width:28px;height:28px"></div>
            <p class="color-text2 mt-12 text-sm">加载剧情图谱…</p>
          </div>

          <div v-else>
            <!-- 工具栏: 刷新 + 章节滑块 + 子tab -->
            <div class="sg-toolbar">
              <button class="btn btn-ghost btn-xs" @click="loadStoryGraph(0)" :disabled="sgLoading" style="font-size:12px">🔄 刷新</button>
              <span class="text-xs color-text3" style="margin-left:6px" v-if="sgData?.last_updated_chapter">
                最后更新: Ch{{ sgData.last_updated_chapter }}
                <template v-if="sgData.filtered_to_chapter"><span style="color:var(--accent)"> (回溯至Ch{{ sgData.filtered_to_chapter }})</span></template>
              </span>
              <div class="sg-chapter-slider" v-if="activeNovel?.state?.total_chapters">
                <span class="text-xs color-text3">追踪至 Ch</span>
                <input type="range" v-model.number="sgChapterFilter" :min="1" :max="activeNovel.state.total_chapters" style="width:120px;margin:0 6px">
                <span class="text-xs font-semibold" style="color:var(--accent)">{{ sgChapterFilter }}</span>
                <button class="btn btn-ghost btn-xs" @click="sgChapterFilter=(sgData?.last_updated_chapter||(activeNovel.state.completed_chapters||[]).length+1);loadStoryGraph(0)" style="font-size:10px;margin-left:4px">最新</button>
              </div>
            </div>
            
            <!-- 子tabs -->
            <div class="sg-subtabs">
              <button class="sg-subtab" :class="{active:sgSubTab==='overview'}" @click="sgSubTab='overview'">📊 概览</button>
              <button class="sg-subtab" :class="{active:sgSubTab==='threads'}" @click="sgSubTab='threads'">
                剧情线 <span class="sg-subtab-count">{{ sgStats.activeThreads }}/{{ sgStats.totalThreads }}</span>
              </button>
              <button class="sg-subtab" :class="{active:sgSubTab==='foreshadows'}" @click="sgSubTab='foreshadows'">
                伏笔 <span class="sg-subtab-count" :class="{'sg-count-warn':sgStats.overdueForeshadows>0}">{{ sgStats.unresolvedForeshadows }}/{{ sgStats.totalForeshadows }}</span>
              </button>
              <button class="sg-subtab" :class="{active:sgSubTab==='characters'}" @click="sgSubTab='characters'">
                角色 <span class="sg-subtab-count">{{ sgStats.trackedChars }}</span>
              </button>
              <button class="sg-subtab" :class="{active:sgSubTab==='calibration'}" @click="sgSubTab='calibration'">
                校准 <span class="sg-subtab-count" :class="{'sg-count-warn':(sgCalibration?.score||100)<70}">{{ sgCalibration?.score??'--' }}</span>
              </button>
              <button class="sg-subtab" :class="{active:sgSubTab==='relations'}" @click="sgSubTab='relations'">
                🕸️ 人物关系图
              </button>
              <button class="sg-subtab" :class="{active:sgSubTab==='timeline'}" @click="sgSubTab='timeline'">
                📈 剧情线图
              </button>
              <button class="sg-subtab" :class="{active:sgSubTab==='canvas'}" @click="sgSubTab='canvas'">
                🎨 画布
              </button>
            </div>

            <!-- ====== 概览 Tab ====== -->
            <div v-if="sgSubTab==='overview'">
              <div class="sg-dashboard">
                <div class="sg-stat-card" @click="sgSubTab='threads'" style="cursor:pointer">
                  <div class="sg-stat-num">{{ sgStats.activeThreads }}/{{ sgStats.totalThreads }}</div>
                  <div class="sg-stat-label">活跃剧情线</div>
                </div>
                <div class="sg-stat-card" @click="sgSubTab='foreshadows'" style="cursor:pointer">
                  <div class="sg-stat-num" :style="{color:sgStats.overdueForeshadows>0?'#f85149':''}">{{ sgStats.unresolvedForeshadows }}</div>
                  <div class="sg-stat-label">未回收伏笔<template v-if="sgStats.overdueForeshadows>0"><span style="color:#f85149"> · {{sgStats.overdueForeshadows}}超期</span></template></div>
                </div>
                <div class="sg-stat-card" @click="sgSubTab='characters'" style="cursor:pointer">
                  <div class="sg-stat-num">{{ sgStats.trackedChars }}</div>
                  <div class="sg-stat-label">追踪角色</div>
                </div>
                <div class="sg-stat-card" @click="sgSubTab='calibration'" style="cursor:pointer">
                  <div class="sg-stat-num" :style="{color:sgCalibration?.score<70?'#f85149':sgCalibration?.score>=90?'#3fb950':''}">{{ sgCalibration?.score??'--' }}</div>
                  <div class="sg-stat-label">剧情健康度</div>
                </div>
              </div>

              <!-- 弧线进度条 -->
              <div class="card" v-if="sgArcs?.arcs?.length" style="margin-top:12px">
                <div class="card-title" style="font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center">
                  <span>🎯 弧线规划</span>
                  <span class="text-xs color-text3">{{ sgArcs.stats?.completed_arcs||0 }}/{{ sgArcs.stats?.total_arcs||0 }} 弧已完成</span>
                </div>
                <div class="sg-arcs-bar">
                  <div v-for="a in sgArcs.arcs" :key="a.arc_id" class="sg-arc-segment"
                       :class="{
                         'arc-past': a.end_chapter < (sgArcs.current_chapter||1),
                         'arc-now': sgArcs.current_arc?.arc_id === a.arc_id,
                         'arc-future': a.start_chapter > (sgArcs.current_chapter||1) && sgArcs.current_arc?.arc_id !== a.arc_id
                       }"
                       :style="{flex: a.chapters?.length||1}"
                       @click="sgExpandedArc = sgExpandedArc===a.arc_id ? null : a.arc_id"
                       style="cursor:pointer">
                    <span class="sg-arc-label">{{ a.label || '弧'+a.arc_id }}</span>
                    <span class="sg-arc-range">Ch{{ a.start_chapter }}-{{ a.end_chapter }}</span>
                    <span class="sg-arc-type">{{ {'setup':'🥚','rising':'⚔️','climax':'🔥','resolution':'🌅'}[a.type]||'' }}</span>
                  </div>
                </div>
                <div v-if="sgExpandedArc && sgArcs.current_arc" class="sg-current-arc" style="margin-top:10px;padding:10px;background:var(--bg);border-radius:var(--radius-xs)">
                  <div style="font-size:13px;font-weight:600;margin-bottom:4px">
                    🔍 {{ sgArcs.current_arc.label }} (第{{ sgArcs.current_arc.current_position }}/{{ sgArcs.current_arc.total_in_arc }}章)
                    <span class="text-xs color-text3" style="margin-left:8px">Ch{{ sgArcs.current_arc.start_chapter }}-{{ sgArcs.current_arc.end_chapter }}</span>
                  </div>
                  <div style="font-size:12px;color:var(--text2)">{{ sgArcs.current_arc.goal }}</div>
                  <div style="font-size:11px;color:var(--text3);margin-top:4px">情绪曲线: {{ sgArcs.current_arc.emotional_arc }}</div>
                  <div v-if="sgArcs.current_arc.characters?.length" class="text-xs color-text2 mt-4">参与角色: {{ sgArcs.current_arc.characters.join('、') }}</div>
                </div>
              </div>
              
              <!-- 紧凑摘要 -->
              <div class="sg-grid-2" style="margin-top:12px;gap:12px">
                <div class="card" @click="sgSubTab='threads'" style="cursor:pointer">
                  <div class="card-title" style="font-size:14px;margin:0 0 8px">📊 剧情线 · 最新进展</div>
                  <div v-if="!sgThreads.length" class="text-xs color-text3">暂无数据</div>
                  <div v-for="t in sgThreads.slice(0,3)" :key="t.id" class="sg-thread-item" :style="{borderLeftColor: statusColor(t.status)}">
                    <span style="font-size:12px;font-weight:600">{{ t.name }}</span>
                    <span class="sg-tag">{{ statusLabel(t.status) }}</span>
                    <div v-if="t.key_nodes?.length" class="text-xs color-text3 mt-2">{{ t.key_nodes.slice(-1)[0]?.event?.substring(0,30) }}</div>
                  </div>
                </div>
                <div class="card" @click="sgSubTab='foreshadows'" style="cursor:pointer">
                  <div class="card-title" style="font-size:14px;margin:0 0 8px">📌 伏笔 · 最近埋设</div>
                  <div v-if="!sgForeshadows.length" class="text-xs color-text3">暂无伏笔</div>
                  <div v-for="f in sgForeshadows.slice(0,3)" :key="f.id" class="sg-fs-item" :style="{'--fs-color': fsStatusColor(f)}">
                    <span style="font-size:12px">{{ f.description?.substring(0,35) }}</span>
                    <span class="sg-fs-badge" :style="{background:fsStatusBg(f),color:fsStatusColor(f)}">{{ fsStatusLabel(f) }}</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- ====== 剧情线 Tab ====== -->
            <div v-if="sgSubTab==='threads'">
              <div class="sg-filter-bar">
                <button class="sg-filter-btn" :class="{active:sgThreadFilter==='all'}" @click="sgThreadFilter='all'">全部</button>
                <button class="sg-filter-btn" :class="{active:sgThreadFilter==='active'}" @click="sgThreadFilter='active'">进行中</button>
                <button class="sg-filter-btn" :class="{active:sgThreadFilter==='resolved'}" @click="sgThreadFilter='resolved'">已完结</button>
                <button class="sg-filter-btn" :class="{active:sgThreadFilter==='dormant'}" @click="sgThreadFilter='dormant'">休眠</button>
                <button class="btn btn-ghost btn-xs" @click="createThread" style="margin-left:auto;font-size:11px">+ 新增</button>
              </div>
              <div v-if="!filteredThreads.length" class="text-xs color-text3" style="padding:20px;text-align:center">无匹配剧情线</div>
              <div v-for="t in filteredThreads" :key="t.id" class="sg-thread-item sg-expandable"
                   :class="{expanded:sgExpandedThread===t.id || editState.type==='thread'&&editState.id===t.id}"
                   :style="{borderLeftColor: statusColor(t.status)}">
                <!-- 展示模式 -->
                <template v-if="editState.type!=='thread' || editState.id!==t.id">
                  <div class="flex justify-between items-start" @click="sgExpandedThread = sgExpandedThread===t.id ? null : t.id">
                    <div style="font-size:13px;font-weight:600">{{ t.name }}
                      <span class="sg-tag">{{ {'main_plot':'主线','subplot':'支线','character_arc':'角色弧','mystery':'悬疑'}[t.type]||t.type }}</span>
                      <span class="sg-tag" style="background:rgba(240,136,62,.1);color:#f0883e">P{{ t.priority }}</span>
                    </div>
                    <span class="sg-tag" :style="{background:statusBg(t.status)}">{{ statusLabel(t.status) }}</span>
                  </div>
                  <div class="sg-tension-bar" style="margin:6px 0" @click="sgExpandedThread = sgExpandedThread===t.id ? null : t.id">
                    <div class="sg-tension-fill" :style="{width:(t.current_tension||5)*10+'%',background:tensionGradient(t.current_tension||5)}"></div>
                  </div>
                  <!-- 快捷操作 -->
                  <div class="flex gap-4 mt-6 flex-wrap">
                    <button class="btn btn-ghost btn-xs" @click.stop="quickAction('thread',t.id,'heat_up')" :disabled="(t.current_tension||0)>=10" title="升温" style="font-size:10px">🔥 升温</button>
                    <button class="btn btn-ghost btn-xs" @click.stop="quickAction('thread',t.id,'pause')" v-if="t.status!=='dormant'" title="暂停" style="font-size:10px">⏸️ 暂停</button>
                    <button class="btn btn-ghost btn-xs" @click.stop="quickAction('thread',t.id,'resume')" v-if="t.status==='dormant'" title="恢复" style="font-size:10px">▶️ 恢复</button>
                    <button class="btn btn-ghost btn-xs" @click.stop="quickAction('thread',t.id,'resolve')" v-if="t.status!=='resolved'" title="完结" style="font-size:10px">✅ 完结</button>
                    <button class="btn btn-ghost btn-xs" @click.stop="quickAction('thread',t.id,'raise_priority')" :disabled="(t.priority||0)>=5" title="提优" style="font-size:10px">⬆️</button>
                    <button class="btn btn-ghost btn-xs" @click.stop="quickAction('thread',t.id,'lower_priority')" :disabled="(t.priority||0)<=1" title="降优" style="font-size:10px">⬇️</button>
                    <button class="btn btn-ghost btn-xs" @click.stop="startEdit('thread',t.id)" style="font-size:10px;margin-left:auto" title="详细编辑">✏️ 编辑</button>
                  </div>
                  <!-- 展开详情 -->
                  <div v-if="t.description && sgExpandedThread===t.id" @click="sgExpandedThread=null" class="text-xs color-text2 mt-6" style="line-height:1.6">{{ t.description }}</div>
                  <div v-if="sgExpandedThread===t.id && t.key_nodes?.length" class="sg-timeline mt-8" @click="sgExpandedThread=null">
                    <div v-for="(n,i) in t.key_nodes" :key="i" class="sg-timeline-item">
                      <div class="sg-timeline-dot" :style="{background:tensionGradient(n.tension||5)}"></div>
                      <div class="sg-timeline-content">
                        <span class="sg-timeline-ch">Ch{{ n.chapter }}</span>
                        <span class="sg-timeline-event">{{ n.event }}</span>
                      </div>
                    </div>
                  </div>
                  <div v-if="t.characters?.length" class="text-xs color-text3 mt-4" @click="sgExpandedThread=null">👥 {{ t.characters.join('、') }}</div>
                </template>
                <!-- 编辑模式 -->
                <template v-else>

                    <div class="sg-edit-row">
                      <label class="sg-edit-label">名称</label>
                      <input v-model="editState.data.name" class="sg-edit-input" maxlength="30">
                    </div>
                    <div class="sg-edit-row">
                      <label class="sg-edit-label">类型</label>
                      <select v-model="editState.data.type" class="sg-edit-input">
                        <option value="main_plot">主线</option><option value="subplot">支线</option>
                        <option value="character_arc">角色弧</option><option value="mystery">悬疑</option>
                      </select>
                    </div>
                    <div class="sg-edit-row">
                      <label class="sg-edit-label">状态</label>
                      <select v-model="editState.data.status" class="sg-edit-input">
                        <option value="dormant">休眠</option><option value="active">进行中</option>
                        <option value="advancing">推进中</option><option value="climax">高潮</option><option value="resolved">已完结</option>
                      </select>
                    </div>
                    <div class="sg-edit-row">
                      <label class="sg-edit-label">优先级</label>
                      <input v-model.number="editState.data.priority" type="range" min="1" max="5" class="sg-edit-range">
                      <span class="text-xs font-semibold" style="color:var(--accent);min-width:20px">P{{ editState.data.priority }}</span>
                    </div>
                    <div class="sg-edit-row">
                      <label class="sg-edit-label">紧张度 ({{ editState.data.current_tension }}/10)</label>
                      <input v-model.number="editState.data.current_tension" type="range" min="1" max="10" class="sg-edit-range">
                    </div>
                    <div class="sg-edit-row">
                      <label class="sg-edit-label">描述</label>
                      <textarea v-model="editState.data.description" class="sg-edit-input" rows="2" maxlength="200" style="resize:vertical"></textarea>
                    </div>
                    <div class="sg-edit-row">
                      <label class="sg-edit-label">下一步</label>
                      <input v-model="editState.data.next_planned" class="sg-edit-input" maxlength="60" placeholder="下一章计划...">
                    </div>
                    <div class="flex gap-6 mt-8 justify-end">
                      <button class="btn btn-ghost btn-xs" @click="cancelEdit">取消</button>
                      <button class="btn btn-primary btn-xs" @click="saveEdit">💾 保存</button>
                      <button class="btn btn-ghost btn-xs" @click="deleteThread(t.id)" style="color:var(--red)">🗑️ 删除</button>
                    </div>
                  </div>
                </template>
              </div>
            </div>

            <!-- ====== 伏笔 Tab ====== -->
            <div v-if="sgSubTab==='foreshadows'">
              <div class="sg-filter-bar">
                <button class="sg-filter-btn" :class="{active:sgForeshadowFilter==='all'}" @click="sgForeshadowFilter='all'">全部</button>
                <button class="sg-filter-btn" :class="{active:sgForeshadowFilter==='active'}" @click="sgForeshadowFilter='active'">未回收</button>
                <button class="sg-filter-btn" :class="{active:sgForeshadowFilter==='overdue'}" @click="sgForeshadowFilter='overdue'">超期</button>
                <button class="sg-filter-btn" :class="{active:sgForeshadowFilter==='resolved'}" @click="sgForeshadowFilter='resolved'">已回收</button>
                <button class="btn btn-ghost btn-xs" @click="createForeshadow" style="margin-left:auto;font-size:11px">+ 新增</button>
              </div>
              
              <!-- 伏笔时间线可视化 -->
              <div class="sg-fs-timeline-bar mb-12" v-if="filteredForeshadows.length">
                <div class="text-xs color-text3 mb-4">时间线 (埋设→暗示→揭示→回收)</div>
                <div class="sg-fs-bar-track">
                  <div v-for="f in filteredForeshadows.slice(0,12)" :key="f.id" class="sg-fs-bar-item"
                       :style="{
                         left: ((f.planted_chapter||1) / (activeNovel?.state?.total_chapters||50) * 100) + '%',
                         width: Math.max(3, ((f.planned_payoff_chapter||f.planted_chapter+20) - (f.planted_chapter||1)) / (activeNovel?.state?.total_chapters||50) * 100) + '%',
                         background: fsStatusColor(f),
                         opacity: f.status==='resolved'?0.5:0.8
                       }"
                       :title="f.description?.substring(0,30)">
                  </div>
                </div>
              </div>
              
              <div v-if="!filteredForeshadows.length" class="text-xs color-text3" style="padding:20px;text-align:center">无匹配伏笔</div>
              <div v-for="f in filteredForeshadows" :key="f.id" class="sg-fs-item sg-expandable"
                   :class="{expanded:sgExpandedForeshadow===f.id}"
                   :style="{'--fs-color': fsStatusColor(f)}"
                   @click="sgExpandedForeshadow = sgExpandedForeshadow===f.id ? null : f.id">
                <div class="flex justify-between items-start">
                  <div style="font-size:13px;font-weight:500;flex:1">{{ f.description?.substring(0,60) }}<template v-if="f.description?.length>60">…</template></div>
                  <span class="sg-fs-badge" :style="{background:fsStatusBg(f),color:fsStatusColor(f)}">{{ fsStatusLabel(f) }}</span>
                </div>
                <div class="flex gap-12 text-xs color-text3 mt-4 flex-wrap">
                  <span>🌱 Ch{{ f.planted_chapter }}</span>
                  <span v-if="f.planned_payoff_chapter">📅 Ch{{ f.planned_payoff_chapter }}</span>
                  <span v-if="f.actual_payoff_chapter">✅ Ch{{ f.actual_payoff_chapter }}</span>
                  <span>💡 {{ f.hint_count||1 }}次暗示</span>
                  <span v-if="f.importance">⭐ P{{ f.importance }}</span>
                </div>
                <!-- 快捷操作 -->
                <div class="flex gap-4 mt-6 flex-wrap" v-if="f.status!=='resolved'">
                  <button class="btn btn-ghost btn-xs" @click.stop="quickAction('foreshadow',f.id,'resolve')" title="现在回收" style="font-size:10px">✅ 回收</button>
                  <button class="btn btn-ghost btn-xs" @click.stop="quickAction('foreshadow',f.id,'delay',{offset:5})" title="推迟5章" style="font-size:10px">⏪ 推迟5章</button>
                  <button class="btn btn-ghost btn-xs" @click.stop="startEdit('foreshadow',f.id)" style="font-size:10px;margin-left:auto" title="编辑">✏️</button>
                </div>
                <!-- 展开后显示完整描述 -->
                <div v-if="sgExpandedForeshadow===f.id && f.description" class="text-xs color-text2 mt-6" style="line-height:1.6">
                  {{ f.description }}
                </div>
                <div v-if="sgExpandedForeshadow===f.id && f.thread_id" class="text-xs color-text3 mt-4">
                  关联剧情线: {{ f.thread_id }}
                </div>
              </div>
            </div>

            <!-- ====== 角色 Tab ====== -->
            <div v-if="sgSubTab==='characters'">
              <div v-if="!sgCharSnapshots || !Object.keys(sgCharSnapshots).length" class="text-xs color-text3" style="padding:20px;text-align:center">暂无角色数据</div>
              <div class="sg-char-grid">
                <div v-for="(snap,name) in sgCharSnapshots" :key="name" class="sg-char-card sg-expandable"
                     :class="{expanded:sgExpandedChar===name}"
                     @click="sgExpandedChar = sgExpandedChar===name ? null : name">
                  <div style="font-size:14px;font-weight:600;margin-bottom:6px">{{ name }}
                    <span class="text-xs color-text3" style="font-weight:400">上次出场 Ch{{ snap.last_chapter_appeared||0 }}</span>
                    <button class="btn btn-ghost btn-xs" @click.stop="startEdit('character',name)" style="float:right;font-size:10px" title="编辑角色">✏️</button>
                    <button class="btn btn-ghost btn-xs" @click.stop="distillCharProfile(name)" style="float:right;margin-right:6px;font-size:10px" :disabled="charProfiling===name" title="用女娲框架蒸馏人设（心智模型/决策启发式/表达DNA/反模式）">🧬 蒸馏人设</button>
                  </div>
                  <div v-if="charProfiles[name]" class="text-xs mt-2" style="background:rgba(188,140,255,.08);border:1px solid rgba(188,140,255,.25);border-radius:8px;padding:8px">
                    <div style="color:var(--purple);font-weight:600;margin-bottom:4px">🧬 已蒸馏人设 <span class="color-text3" style="font-weight:400">({{ (charProfiles[name].decision_heuristics||[]).length }}条决策 · {{ (charProfiles[name].expression_dna||[]).length }}条表达DNA)</span></div>
                    <div v-for="m in (charProfiles[name].mental_models||[]).slice(0,3)" style="line-height:1.7">🔷 {{ m.name||m }}<span v-if="m.content" class="color-text3"> — {{ String(m.content).substring(0,40) }}</span></div>
                  </div>
                  <div v-if="snap.current_location" class="text-xs color-text2">📍 {{ snap.current_location }}</div>
                  <div v-if="snap.current_emotion" class="text-xs color-text2">😶 {{ snap.current_emotion }}</div>
                  <div v-if="snap.current_power_level" class="text-xs color-text2">⚡ {{ snap.current_power_level }}</div>
                  <!-- 展开详情 -->
                  <div v-if="sgExpandedChar===name">
                    <div v-if="snap.active_goals?.length" class="text-xs color-text2 mt-6">🎯 目标: {{ snap.active_goals.join('、') }}</div>
                    <div v-if="snap.known_secrets?.length" class="text-xs mt-4" style="color:var(--purple)">🔮 已知秘密: {{ snap.known_secrets.join('、') }}</div>
                    <div v-if="snap.status_effects?.length" class="text-xs mt-4" style="color:var(--red)">⚠ 状态异常: {{ snap.status_effects.join('、') }}</div>
                    <div v-if="snap.relationship_changes?.length" class="text-xs color-text2 mt-6">
                      <div class="font-semibold mb-2">关系变化:</div>
                      <div v-for="(rc,i) in snap.relationship_changes.slice(-5)" :key="i" class="ml-8" style="line-height:1.8">
                        ↔ {{ rc.with }}: {{ rc.change }} <span class="color-text3">(Ch{{ rc.chapter }})</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- ====== 校准 Tab ====== -->
            <div v-if="sgSubTab==='calibration'">
              <div class="card" v-if="sgCalibration">
                <div class="card-title" style="font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between">
                  <span>🔍 校准报告</span>
                  <span :style="{color:sgCalibration.score>=70?'#3fb950':'#f85149',fontSize:'18px',fontWeight:700}">{{ sgCalibration.score }}/100</span>
                </div>
                <div class="text-xs color-text3 mb-8">上次校准: Ch{{ sgCalibration.calibrated_at_chapter||'--' }}</div>
                
                <div v-if="sgCalibration.plot_drift_items?.length" class="sg-calib-section">
                  <div class="text-xs font-semibold mb-4" style="color:#f0883e">⚠ 剧情偏移 ({{ sgCalibration.plot_drift_items.length }})</div>
                  <div v-for="(item,i) in sgCalibration.plot_drift_items" :key="'drift'+i" class="sg-calib-item"
                       :style="{borderLeftColor: item.severity==='high'?'#f85149':item.severity==='mid'?'#f0883e':'#8b949e'}">
                    <span class="sg-severity-tag" :class="'sev-'+item.severity">{{ item.severity }}</span>
                    {{ item.description }}
                  </div>
                </div>
                
                <div v-if="sgCalibration.overdue_foreshadows?.length" class="sg-calib-section">
                  <div class="text-xs font-semibold mb-4" style="color:#f85149">⏰ 超期伏笔 ({{ sgCalibration.overdue_foreshadows.length }})</div>
                  <div v-for="(f,i) in sgCalibration.overdue_foreshadows.slice(0,8)" :key="'odfs'+i" class="sg-calib-item" style="border-left-color:#f85149">
                    [Ch{{ f.planted_chapter }} → 计划Ch{{ f.planned_payoff_chapter }}] {{ f.description?.substring(0,60) }}
                  </div>
                </div>
                
                <div v-if="sgCalibration.character_issues?.length" class="sg-calib-section">
                  <div class="text-xs font-semibold mb-4" style="color:var(--purple)">👤 角色问题</div>
                  <div v-for="(ci,i) in sgCalibration.character_issues" :key="'ci'+i" class="sg-calib-item" style="border-left-color:#7c3aed">
                    {{ ci.char }}: {{ ci.issue }}
                  </div>
                </div>
                
                <div v-if="sgCalibration.recommendations?.length" style="margin-top:10px">
                  <div class="text-xs font-semibold mb-4" style="color:#58a6ff">💡 建议 ({{ sgCalibration.recommendations.length }})</div>
                  <div v-for="(r,i) in sgCalibration.recommendations" :key="'rec'+i" class="text-xs color-text2" style="padding:2px 0;line-height:1.6">
                    <span style="color:var(--accent);font-weight:600">{{ i+1 }}.</span> {{ r }}
                  </div>
                </div>
                
                <div v-if="!sgCalibration.plot_drift_items?.length && !sgCalibration.overdue_foreshadows?.length && !sgCalibration.character_issues?.length" class="text-center" style="padding:20px;color:var(--green)">
                  ✅ 剧情状态良好，无明显问题
                </div>
              </div>
              <div v-else class="text-center" style="padding:40px;color:var(--text3)">
                <div style="font-size:36px;margin-bottom:8px">🔍</div>
                <p class="text-sm">尚未执行校准，每10章自动触发</p>
              </div>
            </div>

            <!-- ====== v2.4: 人物关系图 Tab ====== -->
            <div v-if="sgSubTab==='relations'">
              <div v-if="!relationGraph.nodes.length" class="text-center" style="padding:40px;color:var(--text3)">
                <div style="font-size:36px;margin-bottom:8px">🕸️</div>
                <p class="text-sm">暂无角色关系数据，请先生成章节</p>
              </div>
              <div v-else class="sg-relation-container">
                <div class="sg-legend">
                  <span class="text-xs color-text3" style="font-weight:600">图例</span>
                  <span class="sg-legend-item"><span class="sg-legend-dot" style="background:var(--accent);box-shadow:0 0 6px var(--accent)"></span> 关系变化</span>
                  <span class="sg-legend-item"><span style="display:inline-block;width:12px;border-top:1.5px dashed var(--accent);opacity:.6;vertical-align:middle;margin-right:4px"></span> 剧情共线</span>
                  <span class="text-xs color-text3" style="margin-left:auto">拖拽节点 · 滚轮缩放</span>
                </div>
                <div class="sg-relation-svg-wrap" ref="relationSvgWrap" :style="{height:relationHeight+'px'}">
                  <svg :viewBox="`0 0 ${relationViewBox.w} ${relationViewBox.h}`" 
                       class="sg-relation-svg"
                       @wheel.prevent="zoomRelation"
                       @mousedown="startPanRelation"
                       @mousemove="doPanRelation"
                       @mouseup="endPanRelation"
                       @mouseleave="endPanRelation">
                    <defs>
                      <!-- 点状网格图案 -->
                      <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
                        <circle cx="15" cy="15" r="0.8" fill="var(--border)" opacity="0.3"/>
                      </pattern>
                      <!-- 发光滤镜 -->
                      <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
                        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                      </filter>
                      <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
                        <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
                        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                      </filter>
                      <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
                        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
                      </filter>
                      <!-- 每个角色的渐变色 -->
                      <radialGradient v-for="(node, i) in relationGraph.nodes" :key="'grad'+i" :id="'grad'+i" cx="40%" cy="35%">
                        <stop offset="0%" :stop-color="node.glowColor"/>
                        <stop offset="100%" :stop-color="node.color"/>
                      </radialGradient>
                      <!-- 边线渐变 -->
                      <linearGradient id="edgeGradSolid" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.6"/>
                        <stop offset="50%" stop-color="var(--accent)" stop-opacity="0.9"/>
                        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.6"/>
                      </linearGradient>
                      <linearGradient id="edgeGradDash" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.25"/>
                        <stop offset="50%" stop-color="var(--accent)" stop-opacity="0.5"/>
                        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.25"/>
                      </linearGradient>
                    </defs>
                    <!-- 背景网格 -->
                    <rect width="100%" height="100%" fill="url(#dotGrid)"/>
                    <!-- 连线（贝塞尔曲线） -->
                    <path v-for="(edge, i) in relationEdges" :key="'e'+i"
                          :d="edgeCurve(edge)"
                          :stroke="edge.dashed ? 'url(#edgeGradDash)' : 'url(#edgeGradSolid)'"
                          :stroke-width="edge.dashed ? 1.2 : 2"
                          :stroke-dasharray="edge.dashed?'6,4':'none'"
                          fill="none"
                          :opacity="sgHoveredEdge===i ? 1 : sgHoveredChar && sgHoveredChar!==edge.source && sgHoveredChar!==edge.target ? 0.08 : 0.55"
                          class="sg-edge-line"
                          @mouseenter="sgHoveredEdge=i" @mouseleave="sgHoveredEdge=null"/>
                    <!-- 边标签 -->
                    <g v-for="(edge, i) in relationEdges" :key="'elg'+i"
                       :opacity="sgHoveredEdge===i ? 1 : 0"
                       style="transition:opacity .2s">
                      <rect :x="(edge.x1+edge.x2)/2-20" :y="edgeCurveMid(edge).y-12" width="40" height="16" rx="4"
                            fill="var(--bg)" stroke="var(--border)" stroke-width="0.5"/>
                      <text :x="(edge.x1+edge.x2)/2" :y="edgeCurveMid(edge).y"
                            class="edge-label" style="font-size:9px">{{ edge.label?.substring(0,6) }}</text>
                    </g>
                    <!-- 节点 -->
                    <g v-for="(node, i) in relationNodes" :key="'n'+i"
                       :transform="`translate(${node.x},${node.y})`"
                       :style="`cursor:${relationDragging===i?'grabbing':'grab'}`"
                       @mousedown.stop="startDragRelationNode(i, $event)"
                       @mouseenter="sgHoveredChar=node.id"
                       @mouseleave="sgHoveredChar=null"
                       class="sg-glow-node">
                      <!-- 阴影层 -->
                      <circle :r="node.radius" fill="#000" opacity="0.15" 
                              :transform="`translate(0,${node.radius*0.08})`" 
                              :filter="sgHoveredChar===node.id ? 'url(#dropShadow)' : 'none'"/>
                      <!-- 主体渐变圆 -->
                      <circle :r="node.radius" :fill="`url(#grad${node.gradIndex})`"
                              :filter="sgHoveredChar===node.id ? 'url(#glowStrong)' : 'none'"/>
                      <!-- 内圈 -->
                      <circle :r="node.radius - 3" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
                      <!-- 角色名 -->
                      <text text-anchor="middle" dy="-2" font-size="13" font-weight="700" fill="#fff"
                            style="text-shadow:0 1px 3px rgba(0,0,0,.3)">{{ node.label?.substring(0,4) }}</text>
                      <!-- 在线状态指示器 -->
                      <circle :r="3" :cx="node.radius-6" :cy="-node.radius+6" 
                              :fill="node.last_chapter >= lastActiveChapter ? '#3fb950' : '#8b949e'"
                              :opacity="node.last_chapter >= lastActiveChapter ? 1 : 0.4"/>
                      <!-- 情绪图标（悬浮显示） -->
                      <text v-if="node.emotionIcon" text-anchor="middle" dy="14" font-size="12"
                            :opacity="sgHoveredChar===node.id ? 1 : 0.5" style="transition:opacity .2s">
                        {{ node.emotionIcon }}
                      </text>
                    </g>
                  </svg>
                </div>
                <!-- 悬浮详情 -->
                <div v-if="sgHoveredChar && hoveredCharDetail" class="sg-char-tooltip">
                  <div class="tt-name">
                    <span class="tt-dot" :style="{background:hoveredCharDetail.color}"></span>
                    {{ hoveredCharDetail.label }}
                  </div>
                  <div v-if="hoveredCharDetail.emotion" class="text-xs" style="color:var(--text2);margin-bottom:6px">{{ hoveredCharDetail.emotionIcon }} {{ hoveredCharDetail.emotion }}</div>
                  <div v-if="hoveredCharDetail.location" class="text-xs color-text3">📍 {{ hoveredCharDetail.location }}</div>
                  <div v-if="hoveredCharDetail.power_level" class="text-xs color-text3">⚡ {{ hoveredCharDetail.power_level }}</div>
                  <div v-if="hoveredCharDetail.goals?.length" class="text-xs color-text2 mt-2" style="line-height:1.6">🎯 {{ hoveredCharDetail.goals.join(' · ') }}</div>
                  <div v-if="hoveredCharDetail.last_chapter" class="text-xs color-text3 mt-2">最近出场: Ch{{ hoveredCharDetail.last_chapter }}</div>
                </div>
                <!-- 调整大小手柄 -->
                <div class="sg-resize-handle" @mousedown="startResize('relation', $event)" title="拖拽调整高度"></div>
              </div>
            </div>

            <!-- ====== v2.4: 剧情线图 Tab ====== -->
            <div v-if="sgSubTab==='timeline'">
              <div v-if="!plotTimeline.lanes?.length" class="text-center" style="padding:40px;color:var(--text3)">
                <div style="font-size:36px;margin-bottom:8px">📈</div>
                <p class="text-sm">暂无剧情线数据，请先生成章节</p>
              </div>
              <div v-else class="sg-timeline-container">
                <div class="sg-legend">
                  <span class="text-xs color-text3" style="font-weight:600">图例</span>
                  <span class="sg-legend-item"><span class="sg-legend-dot" style="background:#f85149;box-shadow:0 0 6px #f85149"></span> 主线</span>
                  <span class="sg-legend-item"><span class="sg-legend-dot" style="background:#f59e0b;box-shadow:0 0 6px #f59e0b"></span> 支线</span>
                  <span class="sg-legend-item"><span class="sg-legend-dot" style="background:#8b5cf6;box-shadow:0 0 6px #8b5cf6"></span> 角色弧</span>
                  <span class="sg-legend-item"><span class="sg-legend-dot" style="background:#06b6d4;box-shadow:0 0 6px #06b6d4"></span> 悬疑</span>
                  <span style="margin-left:12px;width:1px;height:14px;background:var(--border)"></span>
                  <span class="sg-legend-item"><span class="sg-legend-dot" style="background:#3fb950"></span> 低</span>
                  <span class="sg-legend-item"><span class="sg-legend-dot" style="background:#f0883e"></span> 中</span>
                  <span class="sg-legend-item"><span class="sg-legend-dot" style="background:#f85149"></span> 高</span>
                  <span class="text-xs color-text3">紧张度</span>
                  <span class="text-xs color-text3" style="margin-left:auto">滚轮缩放 · 拖拽平移</span>
                </div>
                <div class="sg-timeline-svg-wrap" ref="timelineSvgWrap" :style="{height:timelineHeight+'px'}">
                  <svg :viewBox="`0 0 ${timelineViewBox.w} ${timelineViewBox.h}`"
                       class="sg-timeline-svg"
                       @wheel.prevent="zoomTimeline"
                       @mousedown="startPanTimeline"
                       @mousemove="doPanTimeline"
                       @mouseup="endPanTimeline"
                       @mouseleave="endPanTimeline">
                    <defs>
                      <filter id="glowStrong">
                        <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
                        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                      </filter>
                    </defs>
                    <!-- 章节轴 -->
                    <g>
                      <rect x="0" y="0" :width="timelineViewBox.w" height="28" fill="var(--bg)" opacity="0.85"/>
                      <line x1="0" y1="28" :x2="timelineViewBox.w" y2="28" stroke="var(--border)" stroke-width="1"/>
                      <text v-for="ch in timelineChapterLabels" :key="'chl'+ch"
                            :x="chToX(ch)" y="20" text-anchor="middle" font-size="11" font-weight="700"
                            :fill="ch % 10 === 0 ? 'var(--accent)' : 'var(--text3)'">
                        Ch{{ ch }}
                      </text>
                    </g>
                    <!-- 泳道 -->
                    <g v-for="(lane, i) in plotTimeline.lanes" :key="'lg'+i">
                      <!-- 泳道背景 -->
                      <rect x="0" :y="laneY(i)" :width="timelineViewBox.w" height="60" rx="4"
                            :fill="lane.color" fill-opacity="0.04"
                            :stroke="lane.color" stroke-opacity="0.1" stroke-width="1"/>
                      <!-- 泳道标签（左侧固定） -->
                      <g :transform="`translate(4, ${laneY(i)+18})`">
                        <rect x="0" y="-14" width="18" height="18" rx="4" :fill="lane.color" opacity="0.25"/>
                        <text x="9" y="-1" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">P{{ lane.priority }}</text>
                        <text x="24" y="-1" font-size="13" :fill="lane.color" font-weight="700" dominant-baseline="middle">{{ lane.name?.substring(0,14) }}</text>
                      </g>
                      <!-- 泳道中心线 -->
                      <line x1="0" :y1="laneY(i)+40" :x2="timelineViewBox.w" :y2="laneY(i)+40"
                            :stroke="lane.color" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4,8"/>
                      <!-- 事件节点 -->
                      <g v-for="(ev, ei) in lane.events" :key="'ev'+ei"
                         :transform="`translate(${chToX(ev.chapter)}, ${laneY(i)+40})`"
                         class="sg-timeline-event-dot"
                         @mouseenter="sgHoveredEvent={lane:i, idx:ei}"
                         @mouseleave="sgHoveredEvent=null">
                        <circle r="5.5" :fill="tensionGradient(ev.tension||5)" :stroke="lane.color" stroke-width="2"/>
                        <circle r="9" fill="none" :stroke="lane.color" stroke-width="1" opacity="0" style="transition:all .15s"/>
                      </g>
                    </g>
                  </svg>
                </div>
                <!-- 悬浮详情 -->
                <div v-if="sgHoveredEvent && hoveredEventDetail" class="sg-event-tooltip">
                  <div style="font-size:13px;font-weight:700;margin-bottom:6px" :style="{color:plotTimeline.lanes[sgHoveredEvent.lane]?.color}">
                    {{ plotTimeline.lanes[sgHoveredEvent.lane]?.name }}

<script>
const API = window.location.origin;
const { createApp, ref, reactive, computed, watch, nextTick, onMounted, onErrorCaptured } = Vue;

// ── 全局错误捕获（防止页面崩溃黑屏）──
// 注意: 不能使用 innerHTML += 操作 #app，那会炸掉 Vue 的 DOM 树
// 改用 document.body.appendChild 在 body 级别显示错误
window.addEventListener('error', e => {
  const msg = e.message || String(e.error || '');
  console.error('🛡️ [App Error]', msg);
  const banner = document.getElementById('crash-banner') || (() => {
    const el = document.createElement('div');
    el.id = 'crash-banner';
    el.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#e33;color:#fff;padding:12px 16px;font-size:13px;z-index:99999;line-height:1.5;text-align:left';
    document.body.appendChild(el);
    return el;
  })();
  banner.textContent = '⚠️ 页面遇到错误: ' + msg.slice(0, 200);
});

// ── 全局错误捕获（防止 Vue 静默崩溃黑屏）──
window.onerror = function(msg, url, line, col, err) {
  const m = err ? err.message || err.toString() : msg;
  console.error('FATAL:', m);
  // 在页面底部显示错误横幅
  const banner = document.getElementById('crash-banner') || (() => {
    const el = document.createElement('div');
    el.id = 'crash-banner';
    el.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#e33;color:#fff;padding:12px 16px;font-size:13px;z-index:99999;line-height:1.5;text-align:left';
    document.body.appendChild(el);
    return el;
  })();
  banner.textContent = '⚠️ 页面遇到错误: ' + (m.length > 200 ? m.slice(0,200) + '...' : m);
  return false; // 让默认错误处理也跑
};

// 额外监听 Vue 错误事件
window.addEventListener('vue-error', (e) => {
  const banner = document.getElementById('crash-banner');
  if (banner) banner.textContent = '⚠️ Vue 渲染错误: ' + String(e.detail).slice(0, 200);
});

const app = createApp({
  setup() {
    try {
    const currentView = ref('shelf');
    const novels = ref([]); const activeNovel = ref(null);
    const planResult = ref(null); const error = ref(''); const preview = ref(null);
    const toast = reactive({ visible:false, title:'', message:'', icon:'⚠️' });
    const abortCtrl = ref(null);
    const styleCategories = ref({}); const exportSelected = reactive({});
    const editSaved = ref(false); const styleMode = ref('library');
    const customStyleDesc = ref(''); const styleSeeds = ref([]);
    const styleParams = ref({
      narrative_person:{label:'叙事人称',options:[
        {value:'first',label:'第一人称（我）'},{value:'third_limited',label:'第三人称限知'},{value:'third_omniscient',label:'第三人称全知'}
      ]},
      tone:{label:'文风基调',options:[
        {value:'hot_blood',label:'热血昂扬'},{value:'calm',label:'冷静克制'},{value:'humorous',label:'幽默轻松'},{value:'dark',label:'暗黑沉重'},{value:'warm',label:'温馨治愈'}
      ]},
      pacing:{label:'节奏控制',options:[
        {value:'fast',label:'快节奏'},{value:'balanced',label:'张弛有度'},{value:'slow',label:'舒缓细腻'}
      ]},
      dialogue_ratio:{label:'对话比例',options:[
        {value:'low',label:'少对话'},{value:'medium',label:'叙事对话均衡'},{value:'high',label:'对话驱动'}
      ]},
      description_density:{label:'描写密度',options:[
        {value:'sparse',label:'简洁留白'},{value:'moderate',label:'适中'},{value:'rich',label:'浓墨重彩'}
      ]},
      emotion_tendency:{label:'情感倾向',options:[
        {value:'positive',label:'积极向上'},{value:'bittersweet',label:'悲喜交加'},{value:'tragic',label:'悲剧底色'},{value:'neutral',label:'冷静旁观'}
      ]},
      length_preference:{label:'篇幅偏好',options:[
        {value:'short',label:'短篇精炼'},{value:'medium',label:'中篇展开'},{value:'long',label:'长篇铺陈'}
      ]}
    }); const customParams = reactive({
      narrative_person:'third_limited', tone:'hot_blood', pacing:'balanced',
      dialogue_ratio:'medium', description_density:'moderate',
      emotion_tendency:'positive', length_preference:'medium', keyword:''
    });
    const requirements = reactive({subtasks:[]}); const reqInspiration = ref(''); const showReqInput = ref(false);
    const supervisionReport = ref(null);
    const theme = ref(localStorage.getItem('theme') || 'dark');
    const uiStyle = ref(localStorage.getItem('uiStyle') || 'macOS');
    const createProgress = ref(0); const createPhase = ref(''); const createPhaseLabel = ref('');
    const decomposeSummary = ref(null);  // v2.2: 需求拆解摘要
    // v2.3: 按 category 分组子任务（带防御）
    function groupedSubtasks(cat) {
      try {
        if (!decomposeSummary.value) return [];
        const list = decomposeSummary.value.subtasks;
        if (!Array.isArray(list) || !list.length) return [];
        return list.filter(s => s && s.category === cat);
      } catch(e) { console.warn('groupedSubtasks error:', e); return []; }
    }
    const reviewFeedback = ref(''); const batchStreaming = ref('');
    const chapterProgress = ref(0); const chapterProgressLabel = ref('');
    const outlineFeedback = ref(''); const isRegenerating = ref(false);
    
    // ── 全局状态锁：任何生成操作进行时阻断其他操作 ──
    const isBusy = computed(() => loading.create || loading.write || loading.batch || isRegenerating.value);
    
    // ── 大纲结构校验：防止 plan 字段缺失导致渲染崩溃 ──
    const planReady = computed(() => {
      const p = planResult.value;
      if (!p) return false;
      // 确认嵌套结构都存在
      if (!p.worldbuilding || typeof p.worldbuilding !== 'object') return false;
      if (!p.characters || !p.characters.protagonist || typeof p.characters.protagonist !== 'object') return false;
      if (!p.outline || !Array.isArray(p.outline.volumes)) return false;
      return true;
    });
    
    // ── SSE 安全读取器（含超时保护）──
    /* ── 错误弹窗 ── */
    function showToast(msg, title='提示', icon='⚠️') {
      toast.title = title; toast.message = msg; toast.icon = icon; toast.visible = true;
    }
    function reportError(msg, title='操作异常') {
      error.value = msg; showToast(msg, title, '⚠️');
    }

    async function readSSE(response, onEvent, timeoutMs = 300000) {
      if (!response.ok) {
        // 尝试读取错误详情
        let detail = '';
        let retryAfter = 0;
        try { const err = await response.json(); detail = err.detail || err.message || ''; retryAfter = err.retry_after || 0; } catch(_) {}
        if (response.status === 429) {
          throw new Error(`请求过于频繁，请 ${retryAfter || 60} 秒后再试`);
        }
        throw new Error(`服务器错误 (${response.status}): ${detail || response.statusText}`);
      }
      const reader = response.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      let lastData = Date.now();
      const timeoutCheck = setInterval(() => {
        if (Date.now() - lastData > 600000) {  // v2.14: 放宽到10分钟(Android WebView后台节流+多阶段生成)
          reader.cancel('SSE timeout (600s no data)');
          clearInterval(timeoutCheck);
        }
      }, 15000);  // v2.14: 15s检查一次(减少Android WebView JS调度压力)
      
      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          lastData = Date.now();
          buf += dec.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop() || '';
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            try {
              const evt = JSON.parse(line.slice(6));
              if (evt.type === 'ping') continue; // Render心跳，忽略
              if (onEvent(evt) === false) { reader.cancel(); break; }
            } catch (_) {}
          }
        }
      } finally {
        clearInterval(timeoutCheck);
        try { reader.releaseLock(); } catch (_) {}
      }
    }

    const form = reactive({ genre:'修仙', style:'热血爽文', inspiration:'', target_words:500000, title:'', naturalNames:true, normalPacing:false, fastFood:false });
    const loading = reactive({ shelf:false, create:false, write:false, export:false, saving:false, batch:false, xhs:false });
    
    // v2.50: XHS 短篇模式
    const xhsMode = ref(true);  // 默认展开
    const xhsTemplate = ref('爽文_打脸逆袭');
    const xhsInspiration = ref('');
    const xhsResult = ref(null);
    const xhsTemplates = ref([]);
    const xhsPresets = ref([]);
    const xhsPreset = ref(null);
    const xhsProgress = ref(0);
    const xhsPhase = ref('');
    const xhsStreamText = ref('');
    const shelfLoadFailed = ref(false);  // v2.17: 区分"加载失败"和"真正空书架"
    const writingModeLiterary = ref(false);
    const useAtomicMode = ref(true);  // v2.9: 原子化默认开启 — 已升级蓝图+滚动上下文
    const writing = reactive({ chapter:1, content:'', done:false, activeTab:'write' });

    // v2.3: 剧情图谱
    const sgLoading = ref(false);
    const sgData = ref(null);
    const sgArcs = ref(null);
    const sgCalibration = ref(null);
    // v2.3.1: 交互状态
    const sgSubTab = ref('overview');
    const sgChapterFilter = ref(1);
    const sgThreadFilter = ref('all');
    const sgForeshadowFilter = ref('all');
    const sgExpandedThread = ref(null);
    const sgExpandedForeshadow = ref(null);
    const sgExpandedChar = ref(null);
    const sgExpandedArc = ref(null);

    // v2.5: 编辑器状态
    const editState = reactive({ type:null, id:null, data:{} });
    const editShowForm = reactive({ thread:false, foreshadow:false });
    const quickDoing = ref(null);  // which quick action is in progress

    // ── v2.6: 画布编辑器 ──
    const canvasZoom = ref(1);
    const canvasPan = reactive({x:0, y:0});
    const canvasPanning = ref(false);
    const canvasPanStart = reactive({x:0,y:0,px:0,py:0});
    const canvasWrap = ref(null); const canvasInner = ref(null);
    const canvasSelected = ref(null);
    const canvasDragging = ref(null);
    const canvasDragStart = reactive({x:0, y:0, nx:0, ny:0});
    const canvasDragX = ref(0); const canvasDragY = ref(0);
    const canvasDragCh = ref(0); const canvasDragTension = ref(0);
    const canvasToast = ref('');
    const canvasMenu = reactive({show:false, x:0, y:0, lane:0, idx:0});
    
    const canvasLaneH = 70;
    const canvasWidth = computed(() => Math.max(1200, plotTimeline.value.chapter_range.max * 60 + 200));
    const canvasHeight = computed(() => 40 + plotTimeline.value.lanes.length * canvasLaneH + 60);
    const canvasTickChapters = computed(() => {
      const r = plotTimeline.value.chapter_range;
      const arr = [];
      for (let c = r.min; c <= r.max; c++) arr.push(c);
      return arr;
    });
    function chToCanvasX(ch) {
      const r = plotTimeline.value.chapter_range;
      const range = r.max - r.min || 1;
      return 120 + ((ch - r.min) / range) * (canvasWidth.value - 200);
    }
    function tensionColor(v) {
      return v<=3?'#3fb950':v<=5?'#58a6ff':v<=7?'#f0883e':'#f85149';
    }
    
    function zoomCanvas(e) {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.92 : 1.08;
      canvasZoom.value = Math.max(0.3, Math.min(2.5, canvasZoom.value * delta));
    }
    function startCanvasPan(e) {
      if (e.target.closest('.sg-event-node')) return;
      canvasPanning.value = true;
      canvasPanStart.x = e.clientX; canvasPanStart.y = e.clientY;
      canvasPanStart.px = canvasPan.x; canvasPanStart.py = canvasPan.y;
      canvasWrap.value?.classList.add('panning');
    }
    function doCanvasPan(e) {
      if (canvasPanning.value) {
        canvasPan.x = canvasPanStart.px + (e.clientX - canvasPanStart.x);
        canvasPan.y = canvasPanStart.py + (e.clientY - canvasPanStart.y);
        return;
      }
      if (!canvasDragging.value) return;
      const dx = (e.clientX - canvasDragStart.x) / canvasZoom.value;
      const r = plotTimeline.value.chapter_range;
      const range = r.max - r.min || 1;
      const rawCh = r.min + ((canvasDragStart.nx + dx - 120) / (canvasWidth.value - 200)) * range;
      const snapCh = Math.max(r.min, Math.min(r.max, Math.round(rawCh)));
      canvasDragX.value = e.clientX; canvasDragY.value = e.clientY;
      canvasDragCh.value = snapCh;
      canvasDragTension.value = Math.max(1, Math.min(10, Math.round(5 - (e.clientY - canvasDragStart.y) / 25)));
    }
    function endCanvasPan() {
      if (canvasPanning.value) { canvasPanning.value = false; canvasWrap.value?.classList.remove('panning'); return; }
      if (!canvasDragging.value) return;
      const [lid, eidStr] = canvasDragging.value.split(':');
      const ei = parseInt(eidStr);
      const li = plotTimeline.value.lanes.findIndex(l => l.id === lid);
      if (li >= 0 && ei >= 0) {
        const lane = plotTimeline.value.lanes[li];
        const ev = lane.events[ei];

      e.stopPropagation(); e.preventDefault();

      const startX = chToCanvasX(ev.chapter);
      const startY = 40 + li * canvasLaneH + 32;
      
      connectLine = document.createElement('div');
      connectLine.className = 'sg-connect-line';
      connectLine.style.left = startX + 'px';
      connectLine.style.top = startY + 'px';
      document.querySelector('.sg-canvas-inner')?.appendChild(connectLine);
      
      function onMove(me) {
        if (!connectLine) return;
        const rect = document.querySelector('.sg-canvas-inner').getBoundingClientRect();
        const ex = (me.clientX - rect.left) / canvasZoom.value - canvasPan.x / canvasZoom.value;
        const ey = (me.clientY - rect.top) / canvasZoom.value - canvasPan.y / canvasZoom.value;
        const dx = ex - startX, dy = ey - startY;
        const len = Math.sqrt(dx*dx + dy*dy);
        const angle = Math.atan2(dy, dx) * 180 / Math.PI;
        connectLine.style.width = len + 'px';
        connectLine.style.transform = `rotate(${angle}deg)`;
      }
      function onUp(me) {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        if (connectLine) { connectLine.remove(); connectLine = null; }
        // 检测目标
        const target = document.elementFromPoint(me.clientX, me.clientY);
        const card = target?.closest('.sg-card');
        if (card) {
          canvasToast.value = '🔗 关联已创建';
          setTimeout(() => canvasToast.value = '', 1800);
        }
      }
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    }

    // ── 间隙检测 ──
    function getLaneGaps(li) {
      const lane = plotTimeline.value.lanes[li];
      const events = [...lane.events].sort((a,b) => (a.chapter||0)-(b.chapter||0));
      if (events.length < 2) return [];
      const gaps = [];
      for (let i = 1; i < events.length; i++) {
        const gap = events[i].chapter - events[i-1].chapter;
        if (gap > 5) {
          gaps.push({
            from: events[i-1].chapter,
            to: events[i].chapter,
            chapters: gap,
            mid: Math.round((events[i-1].chapter + events[i].chapter) / 2),
          });
        }
      }
      return gaps.slice(0, 2);
    }

    // ── v2.4: 人物关系图 ──
    const relationGraph = computed(() => {
