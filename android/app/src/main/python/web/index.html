<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d1117">
    <title>墨·局 — 小说工坊</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<script src="/vue.global.prod.js?v=4"></script>
<script>
// 诊断: Vue 是否正确加载
if (typeof Vue === 'undefined') {
  document.body.innerHTML = '<div style=\"padding:40px;color:red;font-size:20px\">❌ Vue.js 加载失败 — 请 Ctrl+Shift+R 强制刷新清除缓存</div>';
} else {
  console.log('✅ Vue loaded:', Vue.version);
}
// 全局错误捕获 — 在 Vue 初始化之前
window._errors = [];
window.addEventListener('error', function(e) {
  window._errors.push(e.message || String(e));
  var el = document.getElementById('js-error-log');
  if (!el) {
    el = document.createElement('div');
    el.id = 'js-error-log';
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#e33;color:#fff;padding:8px 12px;font-size:12px;z-index:99999;font-family:monospace;max-height:200px;overflow:auto';
    document.body.prepend(el);
  }
  el.textContent += '\\n' + (e.message || e);
});
</script>
<style>
:root {
  /* ── 新中式极简色板 ── */
  --bg: #f6f3ec; --bg2: #efebe1; --card: #ffffff; --card-hover: #faf8f2;
  --text: #23201a; --text2: #7c7566; --text3: #b0a896;
  --accent: #c0392b; --blue: #3f6d7a; --green: #5f7d55; --red: #b23a2d;
  --gold: #a8843c;
  --border: #e0dacb; --border-light: #ece7da;
  --radius: 8px; --radius-sm: 6px; --radius-xs: 4px;
  --shadow: 0 1px 2px rgba(35,32,26,.04);
  --shadow-lg: 0 2px 6px rgba(35,32,26,.06), 0 12px 32px rgba(35,32,26,.08);
  --font: 'KaiTi','STKaiti','Kaiti SC','Noto Serif SC','Songti SC','SimSun',serif;
  --font-ui: -apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;
  --font-mono: 'SF Mono','JetBrains Mono','Consolas',monospace;
  --ease: cubic-bezier(.4,0,.2,1);
}
[data-theme="light"] {
  --bg: #f6f3ec; --bg2: #efebe1; --card: #ffffff; --card-hover: #faf8f2;
  --text: #23201a; --text2: #7c7566; --text3: #b0a896;
  --accent: #c0392b; --blue: #3f6d7a; --green: #5f7d55; --red: #b23a2d;
  --gold: #a8843c;
  --border: #e0dacb; --border-light: #ece7da;
}
[data-theme="dark"] {
  --bg: #17151a; --bg2: #1e1b21; --card: #232027; --card-hover: #2a2630;
  --text: #e8e4da; --text2: #a39c8c; --text3: #6e675a;
  --accent: #d95748; --blue: #7ba6b5; --green: #8fa884; --red: #d95748;
  --gold: #c9a86a;
  --border: #37323e; --border-light: #2b2730;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.6;transition:background .3s var(--ease)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

#app{display:flex;min-height:100dvh}
[v-cloak]{display:none !important}

/* ═══════ Sidebar（极简侧栏） ═══════ */
.sidebar{width:216px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:28px 0 20px;position:sticky;top:0;height:100dvh;flex-shrink:0;z-index:5}
.sidebar-logo{padding:4px 24px 28px;display:flex;align-items:center;gap:10px}
.sidebar-logo .dot{width:9px;height:9px;background:var(--accent);border-radius:2px;flex-shrink:0}
.sidebar-logo .brand-name{font-size:19px;font-weight:700;letter-spacing:4px;color:var(--text);font-family:var(--font)}
.sidebar-nav{flex:1;padding:0 12px}
.sidebar-nav .nav-item{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;color:var(--text2);cursor:pointer;margin-bottom:2px;transition:all .18s var(--ease);font-family:var(--font-ui);position:relative}
.sidebar-nav .nav-item:hover{background:var(--bg2);color:var(--text)}
.sidebar-nav .nav-item.active{background:rgba(192,57,43,.07);color:var(--accent);font-weight:600}
.sidebar-nav .nav-item.active::before{content:'';position:absolute;left:-12px;top:20%;bottom:20%;width:3px;border-radius:0 2px 2px 0;background:var(--accent)}
.sidebar-nav .nav-icon{font-size:16px;width:20px;text-align:center;opacity:.8}
.sidebar-nav .nav-item.active .nav-icon{opacity:1}
.sidebar-footer{padding:16px 24px 0;font-size:11px;color:var(--text3);display:flex;align-items:center;gap:8px;letter-spacing:.5px;border-top:1px solid var(--border-light);margin:0 12px;padding-top:16px}
.theme-toggle{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;font-size:14px;transition:all .15s;color:var(--text2);border:1px solid transparent}
.theme-toggle:hover{background:var(--bg2);color:var(--text)}

/* ═══════ Main（杂志式留白） ═══════ */
.main{flex:1;max-width:820px;padding:44px 48px 120px;min-width:0;margin:0 auto}
.main-header{margin-bottom:36px}
.main-header h2{font-size:26px;font-weight:700;letter-spacing:1px;margin-bottom:6px;color:var(--text);font-family:var(--font);letter-spacing:3px}
.main-header .sub{font-size:13.5px;color:var(--text2)}

/* ═══════ Buttons ═══════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .18s var(--ease);white-space:nowrap;line-height:1.4;font-family:var(--font-ui);letter-spacing:.3px;user-select:none}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#d14839;box-shadow:0 2px 8px rgba(192,57,43,.25)}
.btn-secondary{background:var(--bg2);color:var(--text);border-color:var(--border)}.btn-secondary:hover{background:var(--border)}
.btn-ghost{background:transparent;color:var(--text2);border-color:var(--border)}.btn-ghost:hover{background:var(--bg2);color:var(--text)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-xs{padding:4px 10px;font-size:11px}

/* ═══════ Form ═══════ */
input,textarea,select{width:100%;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-family:var(--font-ui);outline:none;transition:border .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(192,57,43,.08)}
input::placeholder,textarea::placeholder{color:var(--text3)}
textarea{resize:vertical;min-height:90px;line-height:1.6}
label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.form-group{margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ═══════ Cards（白卡细线） ═══════ */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:14px;transition:border .2s,box-shadow .2s,transform .2s var(--ease)}
.card:hover{border-color:#cbc4b2;box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.card-title{font-size:11px;color:var(--text2);letter-spacing:1.5px;font-weight:700;margin-bottom:16px;text-transform:uppercase}
.card-title::after{content:'';display:block;width:24px;height:2px;background:var(--accent);margin-top:6px;border-radius:1px}

/* ═══════ Style Picker ═══════ */
.style-cat-title{font-size:11px;color:var(--text3);letter-spacing:1.5px;margin:20px 0 10px;font-weight:600}
.style-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.style-card{padding:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .18s var(--ease);text-align:center}
.style-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.style-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:rgba(192,57,43,.03)}
.style-card .sc-name{font-size:13px;font-weight:600;margin-bottom:3px;font-family:var(--font);letter-spacing:1px}
.style-card .sc-author{font-size:10px;color:var(--text3)}
.style-card .sc-desc{font-size:10px;color:var(--text3);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.param-panel{margin-top:4px}
.param-hint{font-size:12px;color:var(--text3);margin-bottom:16px;padding:8px 12px;background:var(--bg2);border-radius:var(--radius-sm)}
.param-group{margin-bottom:14px}
.param-label{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text)}
.param-options{display:flex;flex-wrap:wrap;gap:6px}
.param-btn{padding:6px 12px;border:1px solid var(--border);border-radius:18px;background:var(--card);font-size:12px;cursor:pointer;transition:all .15s;color:var(--text2);white-space:nowrap}
.param-btn:hover{border-color:var(--accent);color:var(--accent)}
.param-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}

.req-list{max-height:200px;overflow-y:auto}
.req-item{display:flex;align-items:center;gap:6px;padding:5px 8px;border-left:3px solid var(--border);margin-bottom:3px;font-size:12px}
.req-status{flex-shrink:0}
.req-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.req-priority{flex-shrink:0;font-size:10px;font-weight:600}

/* ═══════ Shelf（卡片书架） ═══════ */
.shelf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.book-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .22s var(--ease);position:relative}
.book-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:#cbc4b2}
.book-delete{position:absolute;top:8px;right:8px;z-index:3;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:none;background:rgba(35,32,26,.45);color:#fff;font-size:13px;cursor:pointer;opacity:0;transition:opacity .15s,background .15s}
.book-outline{position:absolute;top:8px;right:40px;z-index:3;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:none;background:rgba(35,32,26,.45);color:#fff;font-size:13px;cursor:pointer;opacity:0;transition:opacity .15s,background .15s}
.book-card:hover .book-outline{opacity:1}
.book-outline:hover{background:var(--accent)}
.book-card:hover .book-delete{opacity:1}
.book-delete:hover{background:var(--red)}
.book-cover{height:100px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:rgba(255,255,255,.16);letter-spacing:4px;position:relative;font-family:var(--font)}
.book-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--card) 100%)}
.book-info{padding:14px 16px 10px}
.book-info h3{font-size:15px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
.book-info .meta{font-size:11px;color:var(--text2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.book-progress{display:flex;align-items:center;gap:10px;padding:0 16px 14px}
.progress-bar{flex:1;height:3px;background:var(--border-light);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s var(--ease)}
.progress-text{font-size:10px;color:var(--text3);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ═══════ Skeleton ═══════ */
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skeleton{background:linear-gradient(90deg,var(--border-light) 25%,var(--border) 37%,var(--border-light) 63%);background-size:400px 100%;animation:shimmer 1.4s ease infinite;border-radius:4px}
.skeleton-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:14px}
.skeleton-cover{height:100px;width:100%;margin-bottom:12px}
.skeleton-title{height:18px;width:60%;margin-bottom:8px}
.skeleton-line{height:12px;width:80%;margin-bottom:6px}
.skeleton-line.short{width:40%}
.skeleton-progress{height:3px;width:100%;margin-top:12px;border-radius:2px}

/* ═══════ Tags ═══════ */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;background:var(--bg2);color:var(--text2);border:1px solid var(--border-light)}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:.3px}
.badge-ok{background:rgba(95,125,85,.1);color:var(--green)}
.badge-warn{background:rgba(192,57,43,.09);color:var(--accent)}

/* ═══════ Reading ═══════ */
.reading-container{max-width:640px;margin:0 auto}
.chapter-header{text-align:center;padding:20px 0 22px;border-bottom:1px solid var(--border);margin-bottom:24px}
.chapter-header h2{font-size:20px;font-weight:700;font-family:var(--font);letter-spacing:3px}
.chapter-outline{background:var(--bg2);border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:14px 18px;margin-bottom:18px;border-left:3px solid var(--accent)}
.chapter-outline .co-label{font-size:10px;color:var(--text3);letter-spacing:1.5px;margin-bottom:6px;font-weight:600}
.chapter-outline .co-title{font-size:14px;font-weight:600;margin-bottom:4px;font-family:var(--font);letter-spacing:1px}
.chapter-outline .co-summary{font-size:12px;color:var(--text2);line-height:1.6}
.chapter-outline .co-meta{font-size:10px;color:var(--text3);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
.chapter-content{font-size:16px;line-height:2.05;color:var(--text);white-space:pre-wrap;padding:0 0 40px;font-family:'PingFang SC','Noto Serif SC','Songti SC','SimSun',serif}
.chapter-content p{margin:0 0 1.2em;text-indent:2em}
.chapter-empty{text-align:center;padding:60px 20px;color:var(--text3)}
.chapter-empty .ce-icon{font-size:48px;margin-bottom:12px;opacity:.3}

/* ═══════ Chapter Picker ═══════ */
.chapter-picker{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px;max-height:110px;overflow-y:auto;padding:2px 0}
.chapter-picker .cp-btn{min-width:36px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;color:var(--text2);transition:all .15s;padding:0 8px}
.chapter-picker .cp-btn:hover{background:var(--bg2);color:var(--text)}
.chapter-picker .cp-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.chapter-picker .cp-btn.done{background:rgba(95,125,85,.06);border-color:rgba(95,125,85,.2);color:var(--green)}

/* ═══════ Export ═══════ */
.export-list{max-height:420px;overflow-y:auto}
.export-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;transition:all .15s}
.export-item:hover{border-color:#cbc4b2}
.export-item .ei-info{flex:1;min-width:0}
.export-item .ei-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
.export-item .ei-meta{font-size:11px;color:var(--text3);margin-top:2px}
.export-item .ei-actions{display:flex;gap:6px;flex-shrink:0}
.export-check{width:18px;height:18px;border:2px solid var(--border);border-radius:4px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.export-check.checked{background:var(--accent);border-color:var(--accent)}
.export-check.checked::after{content:'✓';color:#fff;font-size:11px;font-weight:700}
.export-actions{display:flex;gap:8px;margin-top:16px}

/* ═══════ Mobile Bottom Nav ═══════ */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(246,243,236,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);z-index:100;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
[data-theme="dark"] .bottom-nav{background:rgba(23,21,26,.95)}
.bottom-nav .bn-item{flex:1;text-align:center;color:var(--text2);font-size:10px;cursor:pointer;padding:4px;transition:color .15s}
.bottom-nav .bn-item.active{color:var(--accent)}
.bottom-nav .bn-icon{font-size:20px;display:block;margin-bottom:1px}

/* ═══════ Utilities ═══════ */
.text-center{text-align:center}.text-sm{font-size:13px}.text-xs{font-size:11px}
.color-text2{color:var(--text2)}.color-text3{color:var(--text3)}.color-accent{color:var(--accent)}
.w-full{width:100%}.mt-4{margin-top:4px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}
.mb-4{margin-bottom:4px}.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-24{margin-bottom:24px}
.ml-8{margin-left:8px}.mr-8{margin-right:8px}.ml-auto{margin-left:auto}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.gap-6{gap:6px}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}.flex-wrap{flex-wrap:wrap}.flex-1{flex:1}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-bar{width:100%;height:6px;background:var(--border-light);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s var(--ease)}
.toggle-switch{position:relative;display:inline-block;width:40px;height:22px}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--border);border-radius:22px;transition:.2s}
.toggle-slider:before{content:'';position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:var(--text);border-radius:50%;transition:.2s}
.toggle-switch input:checked+.toggle-slider{background:var(--accent)}
.toggle-switch input:checked+.toggle-slider:before{transform:translateX(18px)}
.error-msg{background:rgba(178,58,45,.06);border:1px solid rgba(178,58,45,.15);border-radius:var(--radius-sm);padding:12px 16px;color:var(--red);font-size:13px;margin:12px 0}

/* ═══════ Toast ═══════ */
.toast-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(35,32,26,.4);z-index:9999;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.toast-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);max-width:420px;width:90%;padding:26px;box-shadow:var(--shadow-lg);position:relative;animation:toastDrop .3s var(--ease) both}
@keyframes toastDrop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.toast-box .toast-icon{font-size:32px;text-align:center;margin-bottom:12px}
.toast-box .toast-title{font-size:16px;font-weight:700;margin-bottom:8px;text-align:center;font-family:var(--font);letter-spacing:2px}
.toast-box .toast-body{font-size:14px;color:var(--text2);margin-bottom:20px;text-align:center;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.toast-box .toast-actions{text-align:center}
.toast-close{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:4px}
.toast-close:hover{background:var(--bg2);color:var(--text)}
.toggle-switch{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.toggle-switch input{display:none}
.toggle-slider{width:40px;height:22px;background:var(--border);border-radius:11px;position:relative;transition:background .2s}
.toggle-slider:before{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:transform .2s}
.toggle-switch input:checked+.toggle-slider{background:var(--accent)}
.toggle-switch input:checked+.toggle-slider:before{transform:translateX(18px)}
.success-msg{background:rgba(95,125,85,.06);border:1px solid rgba(95,125,85,.15);border-radius:var(--radius-sm);padding:12px 16px;color:var(--green);font-size:13px;margin:12px 0}
.empty{text-align:center;padding:48px 16px}
.empty .empty-icon{font-size:40px;margin-bottom:12px;opacity:.25}
.empty h3{font-size:16px;font-weight:600;margin-bottom:4px;font-family:var(--font);letter-spacing:2px}
.empty p{font-size:13px;color:var(--text2);margin-bottom:16px}
.toggle-sm.toggle-switch{width:32px;height:18px}
.toggle-sm .toggle-slider:before{width:12px;height:12px;bottom:3px;left:3px}
.toggle-sm input:checked+.toggle-slider:before{transform:translateX(14px)}

/* ═══════ Create Progress ═══════ */
.create-progress{background:var(--bg2);border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:16px 20px;margin-top:12px}
.create-progress .cp-bar{height:6px;background:var(--border-light);border-radius:3px;overflow:hidden;margin-bottom:8px}
.create-progress .cp-fill{height:100%;background:linear-gradient(90deg,var(--accent),#e0755f);border-radius:3px;transition:width .5s var(--ease)}
.create-progress .cp-info{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.create-progress .cp-label{color:var(--text);font-weight:500}
.create-progress .cp-pct{color:var(--text3);font-variant-numeric:tabular-nums}

/* ═══════ Review / Batch ═══════ */
.review-section{background:var(--bg2);border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:14px 18px;margin-bottom:14px;border-left:3px solid var(--accent)}
.review-section .rs-title{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text)}
.outline-feedback{background:rgba(168,132,60,.06);border:1px solid rgba(168,132,60,.18);border-radius:var(--radius-sm);padding:12px 16px}
.batch-status{display:flex;align-items:center;gap:10px}
.batch-preview{font-size:13px;line-height:1.8;color:var(--text2);max-height:160px;overflow-y:auto;padding:8px 12px;background:var(--bg);border:1px solid var(--border-light);border-radius:var(--radius-sm)}
.chapter-progress{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:12px;color:var(--text2)}

/* ═══════ 剧情图谱 ═══════ */
.sg-dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.sg-stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;text-align:center}
.sg-stat-num{font-size:24px;font-weight:800;color:var(--accent);font-family:var(--font)}
.sg-stat-label{font-size:11px;color:var(--text3);margin-top:2px;letter-spacing:1px}
.sg-tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:0}
.sg-tab{padding:8px 16px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.sg-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.sg-subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sg-subtab{padding:5px 12px;font-size:12px;border-radius:16px;border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .15s;background:var(--card)}
.sg-subtab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sg-subtab-count{font-size:10px;opacity:.7;margin-left:2px}
.sg-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sg-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px}
.sg-card-header{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 2px;font-size:11px}
.sg-card-ch{font-weight:700;color:var(--accent);font-size:12px;font-family:var(--font);letter-spacing:1px}
.sg-card-priority{font-size:10px;padding:1px 5px;border-radius:3px;font-weight:700}
.sg-card-body{padding:2px 8px 6px;font-size:12px;color:var(--text);line-height:1.4;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-card-tension{height:3px;margin:0 8px;border-radius:1.5px;transition:width .3s}
.sg-card-chars{display:flex;gap:2px;padding:4px 8px;flex-wrap:wrap}
.sg-card-char{font-size:10px;opacity:.7}
.sg-card-handle{position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);cursor:crosshair;z-index:5;opacity:0;transition:opacity .15s}
.sg-card:hover .sg-card-handle{opacity:1}
.sg-thread-item{padding:10px 12px;border:1px solid var(--border-light);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--bg)}
.sg-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:3px;margin-right:4px}
.sg-char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.sg-char-card{padding:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s}
.sg-char-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.sg-expandable{cursor:pointer}
.sg-filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sg-filter-btn{padding:4px 12px;border-radius:14px;border:1px solid var(--border);font-size:11px;cursor:pointer;color:var(--text2);background:var(--card)}
.sg-filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sg-fs-timeline-bar{display:flex;align-items:flex-end;gap:3px;height:60px;padding:8px;background:var(--bg2);border-radius:var(--radius-sm);margin:8px 0}
.sg-fs-bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.sg-fs-bar-track{width:100%;background:var(--border-light);border-radius:2px;overflow:hidden;height:34px;display:flex;align-items:flex-end}
.sg-fs-badge{font-size:9px;color:var(--text3)}
.sg-fs-item{font-size:10px;color:var(--text2)}
.sg-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text3);margin-top:8px}
.sg-legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:-1px}
.sg-legend-item{display:inline-flex;align-items:center}
.sg-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sg-calib-section{margin-bottom:14px}
.sg-calib-item{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:var(--radius-sm);background:var(--bg);margin-bottom:6px;border-left:3px solid var(--border)}
.sg-arcs-bar{display:flex;height:40px;border-radius:var(--radius-sm);overflow:hidden;margin:10px 0;border:1px solid var(--border-light)}
.sg-arc-segment{display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:600;cursor:pointer;transition:filter .15s;font-family:var(--font)}
.sg-arc-segment:hover{filter:brightness(1.1)}
.sg-arc-range{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text2)}
.sg-arc-type{display:flex;gap:6px;flex-wrap:wrap}
.sg-arc-label{font-size:11px;color:var(--text3)}
.sg-chapter-slider{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:var(--bg2);border-radius:2px;outline:none}
.sg-chapter-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sg-severity-tag{font-size:10px;padding:1px 6px;border-radius:3px;font-weight:700}
.sev-high{background:rgba(178,58,45,.09);color:var(--red)}
.sev-mid{background:rgba(168,132,60,.12);color:var(--gold)}
.sev-low{background:rgba(95,125,85,.09);color:var(--green)}
.sg-tension-bar{height:4px;background:var(--border-light);border-radius:2px;overflow:hidden;flex:1}
.sg-tension-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold),var(--accent));border-radius:2px}
.sg-timeline{position:relative;padding-left:18px}
.sg-timeline::before{content:'';position:absolute;left:4px;top:0;bottom:0;width:1px;background:var(--border)}
.sg-timeline-item{position:relative;padding:6px 0 6px 12px}
.sg-timeline-item::before{content:'';position:absolute;left:-16px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}
.sg-timeline-ch{font-size:11px;font-weight:700;color:var(--accent)}
.sg-timeline-event{font-size:12px;color:var(--text2);line-height:1.5}
.sg-timeline-container{max-height:320px;overflow-y:auto;padding:4px}
.sg-timeline-svg-wrap{position:relative;width:100%;height:420px;overflow:auto;background:var(--bg2);border-radius:var(--radius-sm)}
.sg-timeline-svg{display:block}
.sg-timeline-dot{cursor:pointer}
.sg-timeline-event-dot{transition:all .2s ease;cursor:pointer}
.sg-timeline-event-dot:hover{filter:url(#glowStrong)}
.sg-relation-container{max-height:340px;overflow-y:auto}
.sg-relation-svg-wrap{position:relative;width:100%;height:420px;overflow:auto;background:var(--bg2);border-radius:var(--radius-sm)}
.sg-relation-svg{display:block}
.sg-char-tooltip{position:fixed;z-index:200;background:var(--card);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:8px 12px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.25);pointer-events:none;max-width:240px}
.sg-event-tooltip{position:absolute;z-index:50;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:11px;box-shadow:0 4px 16px rgba(0,0,0,.2);pointer-events:none;white-space:nowrap}
.sg-gap-warn{position:absolute;display:flex;align-items:center;gap:4px;padding:4px 10px;background:rgba(178,58,45,.1);border:1px dashed var(--red);border-radius:6px;font-size:11px;color:var(--red);cursor:pointer;z-index:5;white-space:nowrap;transition:all .15s;animation:warnPulse 2s ease-in-out infinite}
.sg-gap-warn:hover{background:rgba(178,58,45,.2);transform:scale(1.05)}
@keyframes warnPulse{0%,100%{opacity:.7}50%{opacity:1}}
.sg-glow-node{transition:all .25s cubic-bezier(.4,0,.2,1)}
.sg-glow-node:hover{filter:url(#glowStrong)}
.sg-edge-line{transition:all .25s cubic-bezier(.4,0,.2,1)}
.sg-context-menu{position:fixed;z-index:100;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 0;min-width:140px;box-shadow:0 8px 32px rgba(0,0,0,.3);backdrop-filter:blur(12px);animation:menuIn .15s ease}
@keyframes menuIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.sg-context-menu .menu-item{padding:8px 16px;font-size:12px;cursor:pointer;color:var(--text2);display:flex;align-items:center;gap:8px;transition:all .1s}
.sg-context-menu .menu-item:hover{background:var(--accent);color:#fff}
.sg-context-menu .menu-item.danger:hover{background:var(--red)}
.sg-context-menu .menu-divider{height:1px;background:var(--border);margin:4px 0}
.sg-canvas-wrap{position:relative;width:100%;height:520px;overflow:hidden;border-radius:var(--radius-sm);background:var(--bg2);cursor:grab;user-select:none;border:1px solid var(--border-light)}
.sg-canvas-wrap:active{cursor:grabbing}
.sg-canvas-wrap.panning{cursor:grabbing}
.sg-canvas-inner{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.sg-canvas-grid{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:40px 40px;opacity:.07}
.sg-canvas-axis{position:sticky;top:0;z-index:5;height:32px;background:var(--bg);border-bottom:2px solid var(--border);display:flex;align-items:flex-end;padding-bottom:4px}
.sg-canvas-axis .axis-tick{position:absolute;bottom:0;font-size:10px;font-weight:700;color:var(--text3);transform:translateX(-50%);padding-bottom:6px;border-left:1px solid var(--border);height:12px}
.sg-canvas-axis .axis-tick.major{color:var(--accent);font-size:11px;border-left-color:var(--accent)}
.sg-canvas-lane{position:absolute;left:0;right:0;height:64px;border-bottom:1px solid var(--border)}
.sg-canvas-lane-label{position:absolute;left:8px;top:4px;font-size:12px;font-weight:700;z-index:2;background:var(--bg);padding:2px 8px;border-radius:4px;white-space:nowrap;font-family:var(--font);letter-spacing:1px}
.sg-canvas-lane-line{position:absolute;left:0;right:0;top:32px;border-top:1px dashed var(--border);opacity:.3;pointer-events:none}
.sg-event-node{position:absolute;transform:translate(-50%,-50%);cursor:grab;z-index:10;transition:filter .2s,transform .15s;will-change:transform}
.sg-event-node:hover{z-index:20;filter:drop-shadow(0 0 12px currentColor)}
.sg-event-node.dragging{cursor:grabbing;z-index:30;filter:drop-shadow(0 4px 16px rgba(0,0,0,.4));transform:translate(-50%,-50%) scale(1.15)}
.sg-event-node.selected .node-ring{stroke:var(--accent);stroke-width:3;stroke-dasharray:6,3;animation:ringRotate 4s linear infinite}
@keyframes ringRotate{to{stroke-dashoffset:-18}}
.sg-event-node .node-tension-bar{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);height:4px;border-radius:2px;transition:width .3s;min-width:20px}
.sg-drag-preview{position:fixed;z-index:200;pointer-events:none;font-size:11px;color:var(--accent);background:var(--bg);border:1px solid var(--accent);border-radius:4px;padding:4px 10px;box-shadow:0 4px 16px rgba(0,0,0,.3);white-space:nowrap}
.sg-canvas-toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:50;background:var(--accent);color:#fff;padding:6px 18px;border-radius:20px;font-size:12px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.3);animation:toastIn .3s ease, toastOut .3s ease 1.5s forwards;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}
.sg-connect-line{position:absolute;z-index:25;pointer-events:none;border-top:2px dashed var(--accent);transform-origin:0 0;opacity:.8;animation:dashMove .5s linear infinite}
@keyframes dashMove{to{stroke-dashoffset:-12}}
.sg-resize-handle{height:8px;cursor:ns-resize;background:linear-gradient(180deg,transparent 40%,var(--accent) 40%,var(--accent) 45%,transparent 45%,transparent 55%,var(--accent) 55%,var(--accent) 60%,transparent 60%);margin-top:2px;border-radius:2px;transition:background .15s}
.sg-resize-handle:hover{background:linear-gradient(180deg,transparent 40%,var(--accent) 40%,var(--accent) 60%,transparent 60%)}
.sg-resizing *{user-select:none!important;pointer-events:none!important}
.sg-edit-form{margin-top:8px}
.sg-edit-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sg-edit-label{font-size:11px;color:var(--text3);min-width:56px;text-align:right;flex-shrink:0}
.sg-edit-input{flex:1;padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:12px;font-family:var(--font)}
.sg-edit-input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px rgba(192,57,43,.15)}
.sg-edit-range{flex:1;height:4px;-webkit-appearance:none;appearance:none;background:var(--bg2);border-radius:2px;outline:none}
.sg-edit-range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer}

@keyframes sgPulse{0%,100%{opacity:.6}50%{opacity:1}}
.sg-pulse{animation:sgPulse 2s ease-in-out infinite}

/* ═══════ 移动端适配（v2.4.5: 全面适配手机/WebView，此前仅桌面布局） ═══════ */
@media(max-width:768px){
  /* ── 布局骨架：隐藏桌面侧栏，启用底部导航 ── */
  #app{display:block}
  .sidebar{display:none}
  .bottom-nav{display:flex}
  .main{max-width:100%;padding:20px 16px 110px;margin:0}

  /* ── 标题区 ── */
  .main-header{margin-bottom:20px}
  .main-header h2{font-size:22px;letter-spacing:2px}

  /* ── 书架 ── */
  .shelf-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .book-cover{height:150px}
  .book-card .book-delete,.book-card .book-outline{width:28px;height:28px;font-size:12px}

  /* ── 卡片与表单 ── */
  .card{padding:16px}
  .form-row{grid-template-columns:1fr;gap:10px}
  .style-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}

  /* ── 阅读区 ── */
  .reading-container{max-width:100%;padding:0 4px}
  .chapter-content{font-size:16px;line-height:1.9}

  /* ── 写作区：按钮换行，不横向溢出 ── */
  .sg-tabs{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .sg-tabs .sg-tab{white-space:nowrap}
  .flex.justify-between.items-center{flex-wrap:wrap;gap:8px}
  .btn{padding:8px 14px;font-size:13px;min-height:38px}
  .btn-xs,.btn-sm{min-height:34px;padding:6px 10px}
  .flex.gap-6{flex-wrap:wrap;gap:6px}

  /* ── 需求管理卡片内的行内按钮组 ── */
  .card .flex.justify-between{flex-direction:column;align-items:flex-start!important;gap:8px}
  .card .flex.justify-between .flex.gap-6{width:100%}
  .card .flex.justify-between .flex.gap-6 .btn{flex:1}

  /* ── 大纲/图谱 ── */
  .sg-dashboard{grid-template-columns:repeat(2,1fr)}
  .sg-grid-2{grid-template-columns:1fr}
  .sg-char-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .sg-subtabs{font-size:12px}
  .sg-subtab{padding:6px 10px;font-size:12px}
  .sg-relation-svg-wrap{height:380px}
  .sg-timeline-svg-wrap{height:340px}

  /* ── v3.0: 互动模式 ── */
  .interactive-shell{display:flex;flex-direction:column;gap:14px}
  .interactive-story{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px 22px;min-height:280px;max-height:52vh;overflow-y:auto;line-height:1.85;font-size:15px}
  .inter-narr{color:var(--text);margin:10px 0;text-indent:2em}
  .inter-action{color:var(--text3);font-style:italic;margin:8px 0;text-indent:2em;font-size:14px}
  .inter-line{margin:10px 0;display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .inter-speaker{color:#f778ba;font-weight:700;min-width:56px;white-space:nowrap}
  .inter-dialogue{flex:1;color:var(--text)}
  .inter-voice{font-size:11px;color:var(--text3);white-space:nowrap;align-self:center}
  .inter-typing{color:var(--accent);animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .interactive-input{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
  .interactive-facts{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .fact-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;flex-wrap:wrap}
  .fact-badge{font-size:13px}
  .fact-text{flex:1;color:var(--text)}
  .fact-type{font-size:11px;color:var(--text3);background:var(--card);border-radius:4px;padding:1px 6px}
  .fact-active{color:var(--accent)}
  .fact-fulfilled{color:var(--green)}
  .fact-expired{color:var(--text3)}
  .fact-broken{color:var(--red)}
  .inter-actions{display:flex;gap:4px;align-items:center}
  .voice-btn{background:var(--card);border:1px solid var(--border);border-radius:6px;width:26px;height:26px;font-size:12px;cursor:pointer;color:var(--text2)}
  .voice-btn:hover{border-color:var(--accent);color:var(--accent)}
  .inter-line.playing .inter-dialogue{color:var(--accent)}
  .voice-picker{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .sg-relation-svg-wrap svg,.sg-timeline-svg-wrap svg{width:100%;height:100%}

  /* ── 导出列表 ── */
  .export-item{flex-wrap:wrap;gap:8px}
  .ei-actions{width:100%;display:flex;gap:8px}
  .ei-actions .btn{flex:1}

  /* ── 输入控件触控友好 ── */
  input,select,textarea{font-size:16px!important}  /* 防止 iOS 缩放 */
  .req-item .req-title{max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ── 弹层/Toast ── */
  .toast-box{width:88vw;max-width:340px}
  .toast-overlay{padding:16px}
}

/* 超窄屏（≤420px，小手机） */
@media(max-width:420px){
  .shelf-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .book-cover{height:120px}
  .style-grid{grid-template-columns:repeat(2,1fr)}
  .xhs-tpl-grid{grid-template-columns:repeat(2,1fr)!important}
  .main{padding:16px 12px 100px}
  .chapter-content{font-size:15px}
  .main-header h2{font-size:20px}
}
</style>
</head>
<body>
<div id="app" v-cloak>
  <!-- Toast -->
  <div v-if="toast.visible" class="toast-overlay" @click.self="toast.visible=false">
    <div class="toast-box">
      <div class="toast-icon">{{ toast.icon || '⚠️' }}</div>
      <div class="toast-title">{{ toast.title }}</div>
      <div class="toast-body">{{ toast.message }}</div>
      <div class="toast-actions">
        <button class="btn btn-primary" @click="toast.visible=false">知道了</button>
      </div>
    </div>
  </div>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo"><span class="dot"></span><span class="brand-name">墨·局</span></div>
    <nav class="sidebar-nav">
      <div class="nav-item" :class="{active:currentView==='shelf'}" @click="currentView='shelf'"><span class="nav-icon">📜</span>书架</div>
      <div class="nav-item" :class="{active:currentView==='create'}" @click="openCreate"><span class="nav-icon">🖋️</span>开卷</div>
      <div class="nav-item" :class="{active:currentView==='trends'}" @click="openTrends"><span class="nav-icon">🔍</span>追风</div>
      <div class="nav-item" :class="{active:currentView==='write'}" @click="openWrite" v-if="activeNovel"><span class="nav-icon">✒️</span>落笔</div>
      <div class="nav-item" :class="{active:currentView==='export'}" @click="currentView='export'"><span class="nav-icon">📦</span>付梓</div>
    </nav>
    <div class="sidebar-footer">
      <div class="theme-toggle" @click="toggleTheme" :title="theme==='dark'?'切换浅色':'切换深色'">
        {{ theme === 'dark' ? '☀️' : '🌙' }}
      </div>
      <div class="theme-toggle" @click="toggleUIStyle" :title="uiStyle==='macOS'?'切换iOS风格':'切换macOS风格'" style="font-size:13px">
        {{ uiStyle === 'macOS' ? '🍎' : '📱' }}
      </div>
      v0.9 · macOS/iOS
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <!-- ====== Shelf ====== -->
    <template v-if="currentView==='shelf'">
      <div class="main-header">
        <h2>书架</h2>
        <div class="sub">{{ novels.length }} 部作品</div>
      </div>

      <div v-if="loading.shelf && novels.length===0" class="text-center mt-24"><div class="spinner"></div><p class="color-text2 mt-8 text-xs">加载中…</p></div>
      
      <div v-else-if="novels.length===0 && !loading.shelf" class="empty">
        <div class="empty-icon">{{ shelfLoadFailed ? '⚠️' : '📚' }}</div>
        <h3>{{ shelfLoadFailed ? '加载失败' : '书架空空' }}</h3>
        <p>{{ shelfLoadFailed ? '服务器暂未就绪，请稍后重试' : '选择一位大师的风格，开始你的第一部作品' }}</p>
        <button class="btn btn-primary" @click="openCreate" v-if="!shelfLoadFailed">开始创作</button>
        <button class="btn btn-primary" @click="loadShelf(); shelfLoadFailed=false" v-if="shelfLoadFailed">🔄 重新加载</button>
        <button class="btn btn-ghost mt-8" @click="loadShelf" style="font-size:12px" v-if="!shelfLoadFailed">🔄 重新加载</button>
      </div>

      <div v-else class="shelf-grid">
        <div v-for="n in novels" :key="n.id" class="book-card" style="position:relative" @click="openNovel(n)">
          <button class="book-delete" @click.stop="deleteNovel(n)" title="删除此书">✕</button>
          <button class="book-outline" @click.stop="openOutlineFor(n)" title="编辑大纲">📐</button>
          <div class="book-cover" :style="{background:coverGradient(n.id)}">{{ n.title.slice(0,6) }}</div>
          <div class="book-info">
            <h3>{{ n.title }}</h3>
            <div class="meta">
              <span class="tag">{{ n.genre }}</span>
              <span class="tag">{{ n.style }}</span>
              <span class="badge" :class="(n.state.completed_chapters||[]).length?'badge-ok':'badge-warn'">{{ (n.state.completed_chapters||[]).length }}/{{ n.state.total_chapters }}</span>
            </div>
          </div>
          <div class="book-progress">
            <div class="progress-bar"><div class="progress-fill" :style="{width:pct(n)}"></div></div>
            <span class="progress-text">{{ pct(n) }}</span>
          </div>
        </div>
      </div>
    </template>

    <!-- ====== Create ====== -->
    <template v-if="currentView==='create'">
      <div class="main-header">
        <h2>新作品</h2>
        <div class="sub">选择模式开始创作</div>
      </div>

      <!-- v2.50: 小红书爆款短篇模式 -->
      <div class="card" :style="{border:'2px solid '+ (xhsMode ? 'var(--accent)' : 'var(--border)'), background: xhsMode ? 'linear-gradient(135deg, rgba(233,69,96,.08), rgba(255,107,107,.04))' : ''}">
        <div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer" @click="xhsMode=!xhsMode">
          <div>
            <div style="font-size:16px;font-weight:700;color:var(--accent)">📕 小红书爆款短篇</div>
            <div style="font-size:12px;color:var(--text2);margin-top:2px">8000-10000字，女频爽文，一键生成完整短篇 + 爆款标题</div>
          </div>
          <div style="font-size:24px;color:var(--text2);transition:transform .2s" :style="{transform:xhsMode?'rotate(90deg)':''}">▶</div>
        </div>
        <template v-if="xhsMode">
          <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
            <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px">选择模板</div>
            <div class="xhs-tpl-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px">
              <button v-for="t in xhsTemplates" :key="t.key"
                class="btn" :class="xhsTemplate===t.key?'btn-primary':'btn-secondary'"
                style="font-size:11px;padding:8px 6px;text-align:center"
                @click="xhsTemplate=t.key; loadXhsPresets()">
                <div style="font-size:16px">{{ t.emoji }}</div>
                <div style="margin-top:2px">{{ t.label }}</div>
                <div style="font-size:9px;opacity:.5">{{ t.target_words }}字</div>
              </button>
            </div>
            <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px">预设剧情（点一下就能生成）</div>
            <div v-if="xhsPresets.length>0" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:10px;max-height:180px;overflow-y:auto">
              <div v-for="p in xhsPresets" :key="p.id"
                class="btn" :class="xhsPreset?.id===p.id?'btn-primary':'btn-secondary'"
                style="font-size:11px;padding:8px;text-align:left;cursor:pointer"
                @click="xhsPreset=p; xhsInspiration=''">
                <div style="font-weight:600">{{ p.emoji }} {{ p.label }}</div>
                <div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:4px">
                  <span v-for="t in p.tags" style="font-size:9px;background:var(--bg2);color:var(--text2);padding:1px 5px;border-radius:8px">{{ t }}</span>
                </div>
              </div>
            </div>
            <div v-if="xhsPreset" style="margin-bottom:10px;padding:8px 10px;background:var(--bg2);border-radius:6px;font-size:12px;color:var(--text2)">
              📝 <b>{{ xhsPreset.label }}</b>：{{ xhsPreset.inspiration.slice(0,100) }}…
            </div>
            <div class="flex gap-8" style="margin-bottom:10px" v-if="!xhsPreset">
              <input v-model="xhsInspiration" placeholder="或手动输入你的灵感…" style="font-size:12px;flex:1">
            </div>
            <button class="btn" style="width:100%;padding:12px;background:linear-gradient(135deg,#e94560,#ff6b6b);color:#fff;border:none;font-size:15px;font-weight:600"
              @click="doXhsCreate" :disabled="loading.create || loading.xhs || (!xhsPreset && !xhsInspiration.trim())">
              {{ loading.xhs ? '⏳ 生成中…' : '⚡ 一键生成短篇 + 爆款标题' }}
            </button>
            <div v-if="loading.xhs" style="margin-top:12px">
              <div style="height:6px;background:var(--bg2);border-radius:3px;overflow:hidden">
                <div :style="{width:xhsProgress+'%',height:'100%',background:'linear-gradient(90deg,#e94560,#ff6b6b)',transition:'width .3s'}"></div>
              </div>
              <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--text2)">
                <span>{{ xhsPhase || '准备中…' }}</span><span>{{ xhsProgress }}%</span>
              </div>
              <div v-if="xhsStreamText" style="margin-top:8px;padding:8px;background:var(--bg2);border-radius:6px;font-size:11px;color:var(--text2);max-height:120px;overflow-y:auto;white-space:pre-wrap;line-height:1.5">{{ xhsStreamText.slice(-500) }}</div>
            </div>
            <div v-if="xhsResult" style="margin-top:16px;padding:12px;background:var(--bg2);border-radius:8px;font-size:12px">
              <div style="color:var(--gold);margin-bottom:6px">✅ 生成完成 · {{ xhsResult.total_words }}字 · {{ xhsResult.chapters.length }}章</div>
              <div style="color:var(--text2);margin-bottom:6px">📝 推荐标题（点击复制）：</div>
              <div v-for="(t,i) in xhsResult.titles" :key="i" style="padding:4px 0;color:var(--text);border-bottom:1px solid var(--border);cursor:pointer" @click="navigator.clipboard.writeText(t);showToast('标题已复制','','✅')">
                {{ i+1 }}. {{ t }}
              </div>
              <div class="flex gap-8 mt-8">
                <span class="btn btn-primary btn-sm" style="cursor:pointer" @click="openNovel({id: xhsResult.novel_id, title: xhsResult.plan?.title, state: {completed_chapters: xhsResult.chapters.map(c=>c.number), total_chapters: 4, total_words: xhsResult.total_words}})">去书架写作</span>
              </div>
            </div>
          </div>
        </template>
      </div>

      <div class="card" style="margin-top:16px">
        <div style="font-size:14px;font-weight:600;color:var(--text2);margin-bottom:12px">📖 长篇模式 · 自定义创作</div>
        <div class="form-row">
          <div class="form-group"><label>题材</label><select v-model="form.genre"><option v-for="g in genres" :value="g">{{ g }}</option></select></div>
          <div class="form-group"><label>目标字数</label><select v-model="form.target_words"><option :value="10000">1万字</option><option :value="50000">5万字</option><option :value="100000">10万字</option><option :value="150000">15万字</option><option :value="200000">20万字</option><option :value="300000">30万字</option></select></div>
        </div>
        <div class="form-group"><label>书名（留空自动生成）</label><input v-model="form.title" placeholder="我在修真界写代码"></div>
        <div class="form-group"><label>核心灵感</label><textarea v-model="form.inspiration" rows="3" placeholder="用几句话描述你的故事创意，越具体效果越好…"></textarea></div>
        <!-- 命名去AI味开关 -->
        <div class="flex items-center gap-6 mt-8" style="font-size:13px;color:var(--text2)">
          <label class="toggle-switch">
            <input type="checkbox" v-model="form.naturalNames">
            <span class="toggle-slider"></span>
          </label>
          <span>自然命名 <span style="opacity:.55">（禁用"云星辰叶尘无极天帝"等AI高频词）</span></span>
        </div>
        <!-- v2.2: 节奏开关 -->
        <div class="flex items-center gap-8 mt-8" style="font-size:13px;color:var(--text2)">
          <label class="toggle-switch">
            <input type="checkbox" v-model="form.normalPacing">
            <span class="toggle-slider"></span>
          </label>
          <span>
            <span v-if="!form.normalPacing">⚡ 快节奏 <span style="opacity:.5">— 短平快，冲突密集，进展迅速</span></span>
            <span v-else>📖 正常节奏 <span style="opacity:.5">— 铺陈充分，张弛有度，细节丰富</span></span>
          </span>
        </div>
        
        <!-- 快餐模式 -->
        <div class="flex items-center gap-8 mt-6" v-if="!form.normalPacing">
          <label class="toggle">
            <input type="checkbox" v-model="form.fastFood">
            <span class="toggle-slider"></span>
          </label>
          <span>
            <span v-if="form.fastFood">🍔 快餐模式 <span style="opacity:.5">— 对标爆款网文：300字炸开、每章4爽点、虐不过2章、0铺垫</span></span>
            <span v-else style="opacity:.5">→ 勾选开启爆款节奏</span>
          </span>
        </div>
      </div>

      <!-- Style -->
      <div class="card">
        <div class="flex justify-between items-center" style="margin-bottom:16px">
          <div class="card-title" style="margin:0">风格</div>
          <div class="flex gap-6">
            <button class="btn btn-xs" :class="styleMode==='library'?'btn-primary':'btn-ghost'" @click="styleMode='library'">风格库</button>
            <button class="btn btn-xs" :class="styleMode==='params'?'btn-primary':'btn-ghost'" @click="styleMode='params';loadStyleParams()">参数化</button>
            <button class="btn btn-xs" :class="styleMode==='custom'?'btn-primary':'btn-ghost'" @click="styleMode='custom'">自由描述</button>
          </div>
        </div>

        <!-- 风格库 -->
        <template v-if="styleMode==='library'">
          <template v-for="(authors, cat) in styleCategories">
            <div class="style-cat-title">{{ cat }}</div>
            <div class="style-grid">
              <div v-for="s in authors" :key="s.name" class="style-card" :class="{active:form.style===s.name}" @click="form.style=s.name">
                <div class="sc-name">{{ s.name }}</div>
                <div class="sc-author">{{ s.author }}</div>
                <div class="sc-desc" v-if="s.desc">{{ s.desc }}</div>
              </div>
            </div>
          </template>
        </template>

        <!-- 参数化自定义 -->
        <div v-if="styleMode==='params'" class="param-panel">
          <div class="param-hint">选择各维度参数，AI 将据此生成精准匹配的风格。</div>
          <div v-for="(cfg, key) in styleParams" :key="key" class="param-group">
            <div class="param-label">{{ cfg.label }}</div>
            <div class="param-options">
              <button v-for="opt in cfg.options" :key="opt.value"
                class="param-btn" 
                :class="{active:customParams[key]===opt.value}"
                @click="customParams[key]=opt.value">
                {{ opt.label }}
              </button>
            </div>
          </div>
          <div class="param-group">
            <div class="param-label">额外关键词</div>
            <input v-model="customParams.keyword" placeholder="如：赛博朋克背景 / 带点王小波式的黑色幽默…" style="width:100%">
          </div>
          <button class="btn btn-primary w-full mt-12" @click="applyParamStyle" :disabled="isBusy">
            {{ form.style==='自定义参数化风格' ? '✓ 已应用参数化风格' : '应用参数化风格' }}
          </button>
        </div>

        <!-- 自由描述 -->
        <div v-if="styleMode==='custom'" class="mt-8">
          <textarea v-model="customStyleDesc" rows="3" placeholder="描述你想要的文笔风格…&#10;&#10;如：王小波的黑色幽默 + 村上春树的孤独感 + 中国武侠的江湖气。&#10;对话要冷幽默，描写有画面感不啰嗦，节奏快但不乱…"></textarea>
          <div class="flex gap-8 mt-8">
            <button class="btn btn-secondary btn-sm flex-1" @click="applyCustomStyle" :disabled="!customStyleDesc.trim()">{{ form.style.startsWith('自定义') && !form.style.includes('参数化') ? '✓ 已应用' : '应用此风格' }}</button>
            <button class="btn btn-ghost btn-sm" @click="saveStyleSeed" :disabled="!customStyleDesc.trim()">保存种子</button>
          </div>
          <div v-if="styleSeeds.length>0" class="mt-12">
            <div class="style-cat-title">已保存的种子</div>
            <div class="flex gap-6 flex-wrap">
              <span v-for="s in styleSeeds" :key="s.name" class="tag" style="cursor:pointer" @click="loadStyleSeed(s)">{{ s.name }}<span style="opacity:.4;margin-left:4px;cursor:pointer" @click.stop="deleteStyleSeed(s)">×</span></span>
            </div>
          </div>
        </div>
      </div>

      <div v-if="error" class="error-msg" style="cursor:pointer" @click="error=''">{{ error }} <span style="float:right;opacity:.5">✕</span></div>

      <div v-if="loading.create" class="create-progress">
        <div class="cp-bar"><div class="cp-fill" :style="{width:createProgress+'%'}"></div></div>
        <div class="cp-info"><span class="cp-label">{{ createPhaseLabel }}</span><span class="cp-pct">{{ createProgress }}%</span></div>
      </div>
      <button v-else class="btn btn-primary w-full" style="padding:12px;font-size:15px" @click="doCreate">
        生成大纲
      </button>

      <!-- v2.3: 需求分析结果——简化版，避免复杂模板导致渲染崩溃 -->
      <div v-if="decomposeSummary" class="card" style="margin-top:12px;background:var(--bg2);border-color:var(--accent)">
        <div class="card-title" style="color:var(--accent);display:flex;align-items:center;justify-content:space-between">
          <span>📋 需求分析结果</span>
          <span style="font-size:12px;font-weight:400;color:var(--text3)">
            {{ decomposeSummary.p0_count || 0 }}个P0 · 共{{ decomposeSummary.subtask_count || 0 }}项
          </span>
        </div>
        <div style="font-size:13px;color:var(--text2);line-height:1.6">
          <div v-if="decomposeSummary.core_theme"><b>核心主题：</b>{{ decomposeSummary.core_theme }}</div>
          <div v-if="decomposeSummary.target_audience"><b>目标读者：</b>{{ decomposeSummary.target_audience }}</div>
          <div v-if="decomposeSummary.summary" style="color:var(--text3);font-size:12px;margin-top:4px">{{ decomposeSummary.summary }}</div>
          <div v-if="decomposeSummary.offline_mode" style="color:var(--orange);font-size:12px;margin-top:4px">⚠️ 离线模式拆解（AI服务暂时不可用，已使用关键词规则分析。建议检查API Key配置或稍后重试）</div>
        </div>
      </div>

      <!-- Creation Result -->
      <template v-if="planReady && !loading.create">
        <div class="card mt-16">
          <div class="card-title">大纲预览</div>
          <div class="form-group"><label>书名</label><input v-model="planResult.title" style="font-size:17px;font-weight:600;text-align:center"></div>

          <!-- 大纲修改意见 — 顶部醒目位置 -->
          <div class="outline-feedback" style="background:rgba(240,136,62,.06);border-color:rgba(240,136,62,.25);margin-bottom:16px">
            <textarea v-model="outlineFeedback" rows="2" placeholder="💡 用自然语言提修改意见… 如：节奏太慢加冲突戏 / 主角性格太弱 / 加一条暗线 / 中间需要一个背叛转折" style="flex:1;min-height:52px;font-size:14px"></textarea>
            <button class="btn btn-primary btn-sm" @click="doRegenerateOutline" :disabled="isBusy || !outlineFeedback.trim()" style="flex-shrink:0;padding:8px 16px;white-space:nowrap">
              <span v-if="isRegenerating"><span class="spinner"></span></span>
              <span v-else>🔄 AI 修改大纲</span>
            </button>
          </div>
          <div v-if="isRegenerating" class="create-progress" style="margin-bottom:16px">
            <div class="cp-bar"><div class="cp-fill" :style="{width:createProgress+'%'}"></div></div>
            <div class="cp-info"><span class="cp-label">{{ createPhaseLabel }}</span><span class="cp-pct">{{ createProgress }}%</span></div>
          </div>

          <div class="mb-12"><label>世界观</label></div>
          <div class="form-group"><input v-model="planResult.worldbuilding.era" placeholder="时代背景"></div>
          <div class="form-group"><input v-model="planResult.worldbuilding.power_system" placeholder="力量体系"></div>
          <div class="form-group"><textarea v-model="planResult.worldbuilding.core_conflict" rows="2" placeholder="核心冲突"></textarea></div>

          <div class="mb-12"><label>主角</label></div>
          <div class="form-row">
            <div class="form-group"><input v-model="planResult.characters.protagonist.name" placeholder="姓名"></div>
            <div class="form-group"><input v-model="planResult.characters.protagonist.identity" placeholder="身份"></div>
          </div>
          <div class="form-group"><input v-model="planResult.characters.protagonist.cheat" placeholder="金手指"></div>
          <div class="form-group"><textarea v-model="planResult.characters.protagonist.backstory" rows="2" placeholder="背景故事"></textarea></div>

          <div class="flex justify-between items-center mb-12">
            <label style="margin:0">大纲（{{ planResult.outline?.total_chapters || 0 }}章）</label>
            <button class="btn btn-ghost btn-xs" @click="addVolume">＋ 卷</button>
          </div>
          <div v-for="(vol,vi) in planResult.outline.volumes" :key="vi" style="margin-bottom:16px;padding:14px;background:var(--bg2);border:1px solid var(--border-light);border-radius:var(--radius-xs)">
            <div class="flex gap-8 mb-8">
              <input v-model.number="vol.number" style="width:50px;text-align:center;flex-shrink:0" @change="renumberChapters">
              <input v-model="vol.title" placeholder="卷标题" class="flex-1">
              <button class="btn btn-ghost btn-xs" style="color:var(--red)" @click="removeVolume(vi)" v-if="planResult.outline.volumes.length>1">×</button>
            </div>
            <div v-for="(ch,ci) in vol.chapters" :key="ci" style="padding:6px 0;border-bottom:1px solid var(--border-light)">
              <div class="flex gap-8 items-start">
                <span style="font-size:11px;color:var(--text3);padding-top:9px;min-width:30px">Ch{{ ch.number }}</span>
                <div class="flex-1">
                  <input v-model="ch.title" placeholder="章标题" style="margin-bottom:4px;font-size:12px;padding:6px 10px">
                  <input v-model="ch.summary" placeholder="一句话摘要" style="font-size:11px;padding:5px 10px">
                </div>
                <button class="btn btn-ghost btn-xs" style="color:var(--red);margin-top:6px" @click="vol.chapters.splice(ci,1);renumberChapters()" v-if="vol.chapters.length>1">×</button>
              </div>
            </div>
            <button class="btn btn-ghost btn-xs mt-8 w-full" @click="addChapter(vol)">＋ 章节</button>
          </div>

          <div v-if="editSaved" class="success-msg">已保存</div>

          <div class="flex gap-8">
            <button class="btn btn-secondary flex-1" @click="savePlan" :disabled="loading.saving">{{ loading.saving ? '…' : '保存大纲' }}</button>
            <button class="btn btn-primary flex-1" style="padding:12px" @click="confirmAndStart">确认并开始写作</button>
          </div>
        </div>
      </template>
    </template>

    <!-- ====== Trends: 爆火分析 + 逆天生成 ====== -->
    <template v-if="currentView==='trends'">
      <div class="main-header">
        <h2>🔥 爆火小说分析 & 逆天生成</h2>
        <div class="sub">抓取热门小说 → 提取成功模式 → 离谱设定生成</div>
      </div>
      
      <!-- 模式切换 -->
      <div class="card" style="padding:8px 12px">
        <div style="display:flex;gap:6px;align-items:center">
          <span style="font-size:12px;color:var(--text2);margin-right:8px">生成模式:</span>
          <button class="btn btn-sm" :class="bizarreMode==='topical'?'btn-primary':''" @click="bizarreMode='topical'" style="font-size:12px;padding:4px 12px">🌍 时事离谱</button>
          <button class="btn btn-sm" :class="bizarreMode==='twist'?'btn-primary':''" @click="bizarreMode='twist'" style="font-size:12px;padding:4px 12px">🔀 剧情反转</button>
          <button class="btn btn-sm" :class="bizarreMode==='mixed'?'btn-primary':''" @click="bizarreMode='mixed'" style="font-size:12px;padding:4px 12px">🎲 混搭</button>
        </div>
      </div>
      
      <div class="card">
        <div class="card-title">操作</div>
        <div class="flex gap-8">
          <button class="btn btn-primary" @click="doTrendAnalyze" :disabled="trendLoading">
            {{ trendLoading ? '分析中...' : '📊 分析爆火趋势' }}
          </button>
          <button class="btn btn-primary" @click="doBizarreQuick" :disabled="trendLoading" style="background:var(--accent2)">
            {{ trendLoading ? '生成中...' : '🎲 快速生成 (×3)' }}
          </button>
          <button class="btn btn-primary" @click="doBizarreFull" :disabled="trendLoading" style="background:var(--accent3)">
            {{ trendLoading ? '生成中...' : '🚀 完整生成 (×5, 含大纲)' }}
          </button>
        </div>
      </div>

      <!-- 趋势分析结果 -->
      <div class="card" v-if="trendData">
        <div class="card-title">📊 当前爆火趋势</div>
        <div v-if="trendData.patterns">
          <div style="margin-bottom:12px;color:var(--accent);font-weight:600">{{ trendData.patterns.success_formula?.summary }}</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">
            <span v-for="g in Object.keys(trendData.patterns.top_genres||{})" class="tag" style="background:var(--bg2);padding:4px 10px;border-radius:20px;font-size:12px">
              {{ g }} ×{{ trendData.patterns.top_genres[g] }}
            </span>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;">
            <span v-for="(t,i) in (trendData.patterns.common_tropes||[]).slice(0,10)" class="tag" style="background:var(--accent);opacity:0.8;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px">
              #{{ i+1 }} {{ t.name }}
            </span>
          </div>
        </div>
      </div>

      <!-- 热门小说 -->
      <div class="card" v-if="trendData?.hot_novels?.length">
        <div class="card-title">🔥 {{ trendData.source === 'live' ? '实时' : '内置' }}热门榜 TOP{{ trendData.hot_novels.length }}</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px">
          <div v-for="n in trendData.hot_novels" style="background:var(--bg2);padding:8px 12px;border-radius:8px;font-size:12px">
            <div style="font-weight:600;color:var(--accent)">{{ n.title }}</div>
            <div style="color:var(--text2)">{{ n.author }} · {{ n.genre }}</div>
            <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">
              <span v-for="t in (n.tags||[]).slice(0,4)" style="background:var(--bg);padding:2px 6px;border-radius:4px;font-size:11px">{{ t }}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 逆天小说卡片 -->
      <div v-if="bizarreNovels?.length" style="margin-top:16px">
        <div class="card-title" style="font-size:18px;margin-bottom:12px">🌀 剧情反转种子 ({{ bizarreNovels.length }}部)</div>
        <div v-for="(bn,idx) in bizarreNovels" class="card" style="margin-bottom:14px;border-left:3px solid var(--accent2);position:relative;overflow:hidden">
          <div style="position:absolute;top:8px;right:12px;font-size:11px;color:var(--text3);background:var(--bg2);padding:2px 8px;border-radius:10px">{{ bn.premise?.tag || bn.tag }}</div>
          <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px;padding-right:80px">
            <div>
              <div style="font-size:16px;font-weight:700;color:var(--accent)">{{ bn.premise?.title || bn.title }}</div>
              <div style="font-size:12px;color:var(--text2)">{{ bn.premise?.genre || bn.genre }} · {{ bn.premise?.trope || bn.twist }}</div>
            </div>
            <button class="btn btn-primary btn-sm" @click="createBizarreNovel(bn)" style="padding:4px 12px;font-size:12px">📖 创建小说</button>
          </div>
          <div style="font-size:13px;line-height:1.7;color:var(--text);margin-bottom:8px;font-style:italic">{{ bn.premise?.one_liner || bn.one_liner }}</div>
          <div v-if="bn.premise?.synopsis" style="font-size:12px;line-height:1.8;color:var(--text2);background:var(--bg2);padding:10px;border-radius:6px;margin-bottom:8px;white-space:pre-line">{{ bn.premise.synopsis }}</div>
          <div v-if="bn.premise?.twist_chapter_hint" style="font-size:11px;color:var(--accent2);margin-bottom:8px;text-align:right">
            ⚡ 转折节点: {{ bn.premise.twist_chapter_hint }}
          </div>
          <div v-if="bn.outline?.volumes" style="margin-top:8px;padding:8px;background:var(--bg);border-radius:6px;font-size:12px">
            <div style="font-weight:600;margin-bottom:4px">📋 大纲预览</div>
            <div v-for="vol in (bn.outline.volumes||[]).slice(0,2)">
              <div style="color:var(--accent)">第{{ vol.number }}卷: {{ vol.title }}</div>
              <div v-for="ch in (vol.chapters||[]).slice(0,3)" style="padding-left:12px;color:var(--text2)">
                Ch{{ ch.number }} [{{ ch.title }}] {{ ch.summary }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ====== Write ====== -->
    <template v-if="currentView==='write'">
      <div v-if="!activeNovel" style="text-align:center;padding:80px 20px;color:var(--text3)">
        <div style="font-size:48px;margin-bottom:16px">📝</div>
        <div style="font-size:16px;margin-bottom:8px">正在加载小说数据…</div>
        <div style="font-size:13px">如果长时间无反应，请返回书架重新打开</div>
        <button class="btn btn-ghost mt-16" @click="currentView='shelf';loadShelf()">← 返回书架</button>
      </div>
      <div v-else class="reading-container">

        <div class="flex justify-between items-center mb-12">
          <div>
            <h2 style="font-size:18px;margin:0;border:none;padding:0">{{ activeNovel.title }}</h2>
            <div class="text-xs color-text3 mt-4">
              <span class="badge badge-ok mr-8" v-if="(activeNovel.state.completed_chapters||[]).length">{{ (activeNovel.state.completed_chapters||[]).length }}章已完成</span>
              {{ activeNovel.genre }} · {{ activeNovel.style }}
            </div>
          </div>
          <button class="btn btn-ghost btn-xs" @click="openOutline" style="font-size:12px">📋 编辑大纲</button>
        </div>

        <!-- v2.3: 写作 / 剧情图谱 切换 -->
        <div class="sg-tabs">
          <button class="sg-tab" :class="{active:writing.activeTab==='write'}" @click="writing.activeTab='write'">✍️ 写作</button>
          <button class="sg-tab" :class="{active:writing.activeTab==='storygraph'}" @click="switchToStoryGraph">🔍 剧情图谱</button>
          <button class="sg-tab" :class="{active:writing.activeTab==='interactive'}" @click="openInteractive">🎮 互动模式</button>
        </div>

        <!-- v3.0: 互动模式面板 -->
        <div v-if="writing.activeTab==='interactive'" style="margin-top:14px">
          <div v-if="interactive.loading" class="text-center" style="padding:40px 20px">
            <div class="spinner" style="width:30px;height:30px"></div>
            <p class="color-text2 mt-16 text-sm">{{ interactive.loadingMsg || '初始化互动世界…' }}</p>
          </div>

          <div v-else-if="interactive.error" class="empty" style="padding:40px 20px">
            <div class="empty-icon">⚠️</div>
            <h3>互动模式启动失败</h3>
            <p>{{ interactive.error }}</p>
            <button class="btn btn-primary mt-16" @click="openInteractive">🔄 重试</button>
          </div>

          <div v-else class="interactive-shell">
            <!-- 状态栏 -->
            <div class="flex justify-between items-center mb-12" style="flex-wrap:wrap;gap:8px">
              <div class="text-sm">
                <span class="badge badge-ok mr-8">场景 {{ interactive.state.scene_num||0 }}</span>
                <span v-if="interactive.pendingNode" class="badge" style="background:rgba(212,175,55,.15);color:var(--gold)">💬 可对话</span>
                <span v-else class="badge">📖 剧情中</span>
              </div>
              <div class="flex gap-6">
                <button class="btn btn-xs" :class="interactive.autoVoice?'btn-primary':''" @click="toggleAutoVoice" :disabled="interactive.busy" title="对话台词自动语音（旁白静默）">🔊 {{ interactive.autoVoice?'语音开':'语音关' }}</button>
                <button class="btn btn-xs btn-ghost" @click="interactiveRollback" :disabled="interactive.busy" title="回退到上一场景">↩ 回退</button>
                <button class="btn btn-xs btn-ghost" @click="interactiveRestart" :disabled="interactive.busy" title="重开互动（备份旧存档）">🔄 重开</button>
              </div>
            </div>

            <!-- 叙事区（打字机） -->
            <div class="interactive-story" ref="storyBox">
              <template v-for="(blk, i) in interactive.blocks" :key="i">
                <div v-if="blk.type==='narration'" class="inter-narr">{{ blk.content }}</div>
                <div v-else-if="blk.type==='action'" class="inter-action">{{ blk.content }}</div>
                <div v-else class="inter-line" :class="{playing: interactive.speakingLine===i}">
                  <span class="inter-speaker">{{ blk.speaker }}</span>
                  <span class="inter-dialogue">{{ blk.content }}</span>
                  <span class="inter-voice" v-if="interactive.voices[blk.speaker]">🎙 {{ interactive.voices[blk.speaker].voice.replace('zh-CN-','').replace('Neural','') }}</span>
                  <span class="inter-actions" v-if="blk.type==='dialogue'||blk.type==='chat'">
                    <button class="voice-btn" @click="speakLine(blk, i)" :title="interactive.speakingLine===i?'停止':'播放语音'">{{ interactive.speakingLine===i?'⏹':'🔊' }}</button>
                    <button class="voice-btn" @click="openVoicePicker(blk.speaker)" title="更换音色">🎙</button>
                  </span>
                </div>
              </template>
              <div v-if="interactive.typing" class="inter-typing">▋</div>
            </div>

            <!-- v3.1: 音色选择器 -->
            <div v-if="interactive.voicePicker" class="voice-picker">
              <div class="flex justify-between items-center" style="margin-bottom:8px">
                <div class="card-title" style="font-size:13px;margin:0">🎙 更换「{{ interactive.voicePicker }}」的音色</div>
                <button class="btn btn-xs btn-ghost" @click="interactive.voicePicker=null">✕</button>
              </div>
              <div class="flex gap-6" style="flex-wrap:wrap;align-items:center">
                <select class="voice-select" style="flex:1;min-height:34px;font-size:13px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:4px 8px">
                  <option v-for="vc in interactive.voiceCandidates" :key="vc.name" :value="vc.name"
                          :selected="(interactive.voices[interactive.voicePicker]||{}).voice===vc.name">
                    {{ vc.name.replace('zh-CN-','').replace('zh-HK-','').replace('zh-TW-','').replace('Neural','') }}
                    {{ vc.style ? '· '+vc.style : '' }}{{ vc.available ? '' : '（受限）' }}
                  </option>
                </select>
                <button class="btn btn-xs" @click="previewVoice" title="试听当前音色">🔈 试听</button>
                <label class="text-xs muted">语速 <input type="range" min="-50" max="100" v-model.number="interactive.voiceRate" style="width:80px;vertical-align:middle"></label>
                <label class="text-xs muted">音调 <input type="range" min="-50" max="50" v-model.number="interactive.voicePitch" style="width:80px;vertical-align:middle"></label>
                <button class="btn btn-xs btn-primary" @click="saveVoiceOverride">保存</button>
                <button class="btn btn-xs btn-ghost" @click="resetVoiceOverride">恢复默认</button>
              </div>
              <div class="text-xs muted mt-8" v-if="interactive.voicePicker">
                提示：标注「受限」的音色可能受区域限制，播放时会自动使用相近音色替代
              </div>
            </div>

            <!-- 输入区 -->
            <div class="interactive-input" v-if="interactive.pendingNode || interactive.inChat">
              <div class="flex gap-6" style="align-items:center">
                <input v-model="interactive.message" @keyup.enter="sendInteractiveChat"
                       placeholder="说点什么…（可 @角色名 指定对象）" :disabled="interactive.busy"
                       style="flex:1;min-height:38px;font-size:14px" />
                <button class="btn btn-sm btn-primary" @click="sendInteractiveChat" :disabled="interactive.busy||!interactive.message.trim()">💬 说</button>
              </div>
              <div class="flex gap-6 mt-8" style="justify-content:flex-end">
                <button class="btn btn-xs" @click="interactive.forceChat=true;interactive.pendingNode=true" v-if="!interactive.pendingNode && !interactive.inChat">💬 我要说话</button>
                <button class="btn btn-sm btn-primary" @click="continueInteractive" :disabled="interactive.busy">
                  {{ interactive.pendingNode && !interactive.inChat ? '💬 进入对话' : '▶ 继续剧情' }}
                </button>
              </div>
            </div>

            <!-- 你的影响（PACT facts） -->
            <div class="interactive-facts" v-if="(interactive.state.facts||[]).length">
              <div class="card-title" style="font-size:13px;margin-bottom:8px">🧠 你的影响</div>
              <div v-for="f in interactive.state.facts" :key="f.id" class="fact-row">
                <span class="fact-badge" :class="'fact-'+f.status">{{ f.status==='active'?'⏳':f.status==='fulfilled'?'✅':f.status==='expired'?'⌛':'💔' }}</span>
                <span class="fact-text">{{ f.content }}</span>
                <span class="fact-type muted">{{ f.type }}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- v2.3: 写作面板 -->
        <div v-if="writing.activeTab==='write'">

        <!-- 需求管理 & 质量监督 -->
        <div class="card" style="margin-top:12px;background:var(--bg2)">
          <div class="flex justify-between items-center" style="margin-bottom:8px">
            <div class="card-title" style="margin:0;font-size:14px">🧪 需求管理 & 质量监督</div>
            <div class="flex gap-6">
              <button class="btn btn-xs btn-ghost" @click="decomposeRequirements" :disabled="isBusy">拆解需求</button>
              <button class="btn btn-xs btn-ghost" @click="superviseRequirements" :disabled="isBusy||!requirements.subtasks?.length">监督质量</button>
              <button class="btn btn-xs btn-primary" @click="runVerifyLoop" :disabled="isBusy||!requirements.subtasks?.length">🔄 循环校验</button>
            </div>
          </div>
          
          <!-- 需求拆解进度 -->
          <div v-if="requirements.subtasks?.length" class="req-list">
            <div class="req-summary" style="font-size:12px;color:var(--text3);margin-bottom:8px">
              {{ requirements.passed_count||0 }}/{{ (requirements.subtasks||[]).length }} 已通过 · 评分: {{ requirements.overall_score||'--' }}
            </div>
            <div v-for="t in (requirements.subtasks||[])" :key="t.id" class="req-item" 
                 :style="{borderLeftColor: t.status==='passed'?'#4caf50':t.status==='failed'?'#f44336':'var(--border)'}">
              <span class="req-status">{{ t.status==='passed'?'✅':t.status==='failed'?'❌':'⏳' }}</span>
              <span class="req-title" style="font-size:12px">{{ t.title?.substring(0,50) }}</span>
              <span class="req-priority" :style="{color:t.priority==='P0'?'#f44336':'var(--text3)'}">{{ t.priority }}</span>
            </div>
          </div>
          
          <!-- 监督报告 -->
          <div v-if="supervisionReport" class="supervision-report" style="margin-top:8px;padding:10px;background:var(--bg);border-radius:var(--radius-xs)">
            <div style="font-size:13px;font-weight:600;margin-bottom:4px">
              监督报告 · 评分 {{ supervisionReport.overall_score }}
              <span :style="{color:supervisionReport.overall_status==='passed'?'#4caf50':'#f44336'}">
                {{ supervisionReport.overall_status==='passed'?'✅ 全部通过':'❌ 未达标' }}
              </span>
            </div>
            <div style="font-size:11px;color:var(--text3)">{{ supervisionReport.summary_report }}</div>
          </div>
          
          <!-- 新需求输入 -->
          <div v-if="showReqInput" style="margin-top:8px;display:flex;gap:8px">
            <input v-model="reqInspiration" placeholder="输入追加需求…" style="flex:1;font-size:12px;padding:6px 10px">
            <button class="btn btn-xs btn-ghost" @click="addRequirements" :disabled="!reqInspiration.trim()">追加</button>
          </div>
          <button v-else class="btn btn-ghost btn-xs" style="margin-top:4px;font-size:11px" @click="showReqInput=true">+ 追加需求</button>
        </div>

        <!-- 大纲修改意见 — 紧凑行 -->
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 12px;background:rgba(240,136,62,.06);border:1px solid rgba(240,136,62,.15);border-radius:8px">
          <span style="font-size:12px;color:var(--accent);white-space:nowrap;font-weight:600">💡 修改大纲</span>
          <input v-model="outlineFeedback" placeholder="如：加感情线 / 中间需要转折…" style="flex:1;min-width:0;padding:6px 10px;font-size:13px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)">
          <button class="btn btn-primary btn-xs" @click="doRegenerateOutline" :disabled="isBusy || !outlineFeedback.trim()" style="padding:5px 12px;font-size:12px;white-space:nowrap">
            <span v-if="isRegenerating"><span class="spinner"></span></span>
            <span v-else>🔄 执行</span>
          </button>
