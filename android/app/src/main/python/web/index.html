<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d1117">
    <title>墨局 · 让灵感落成故事</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
<script src="/assets/runtime.js?v=20261019"></script>
<script src="/vue.global.prod.js" defer></script>
<script src="/assets/workshop.js?v=20261019" defer></script>
<link rel="stylesheet" href="/assets/theme.css?v=20261019">
<link rel="stylesheet" href="/assets/tools.css?v=20261019">
<link rel="stylesheet" href="/assets/workshop.css?v=20261019">
</head>
<body>
<div id="app" v-cloak>

  <div v-if="toast.visible" class="toast-overlay" @click.self="toast.visible=false">
    <div class="toast-box">
      <div class="toast-icon">{{ toast.icon || '⚠️' }}</div>
      <div class="toast-title">{{ toast.title }}</div>
      <div class="toast-body">{{ toast.message }}</div>
      <div class="toast-actions">
        <button class="btn btn-primary" @click="toast.visible=false">知道了</button>
      </div>
    </div>
  </div>
  <aside class="sidebar">
    <div class="sidebar-logo"><span class="brand-symbol"><icon name="feather"></icon></span><div><span class="brand-name">墨局</span><span class="brand-caption">STORY WORKSHOP</span></div></div>
    <div class="nav-label">创作空间</div>
    <nav class="sidebar-nav" aria-label="主导航">
      <button class="nav-item" :class="{active:currentView==='shelf'}" @click="currentView='shelf'"><icon name="grid"></icon>我的书架</button>
      <button class="nav-item" :class="{active:currentView==='create'}" @click="openCreate"><icon name="feather"></icon>创作工作台</button>
      <button class="nav-item" @click="openRoleplay"><icon name="mask"></icon>角色扮演</button>
      <button class="nav-item" :class="{active:currentView==='trends'}" @click="openTrends"><icon name="compass"></icon>灵感探索</button>
      <button class="nav-item" v-if="activeNovel" :class="{active:currentView==='write'}" @click="openWrite"><icon name="book"></icon>继续写作</button>
      <button class="nav-item" :class="{active:currentView==='export'}" @click="currentView='export'"><icon name="download"></icon>作品导出</button>
    </nav>
    <div class="sidebar-note"><icon name="spark"></icon><strong>每个灵感，都值得写下</strong><p>从世界的第一笔，<br>到故事的下一章。</p></div>
    <div class="sidebar-footer"><button class="btn btn-ghost btn-xs" @click="connectionOpen=true"><icon name="settings" size="15"></icon>连接设置</button><button class="icon-button" @click="toggleTheme" :aria-label="theme==='dark'?'切换浅色主题':'切换深色主题'"><icon :name="theme==='dark'?'sun':'moon'" size="17"></icon></button></div>
  </aside>

  <main class="main">
    <header class="workspace-topbar"><div class="workspace-breadcrumb"><span>墨局</span><span>/</span><span>{{ viewLabel }}</span></div><div class="workspace-actions"><span class="workspace-date">{{ todayLabel }}</span><button class="connection-chip" @click="connectionOpen=true"><i class="connection-dot" :class="{ready:provider.configured}"></i>{{ provider.configured ? provider.model : '连接模型' }}</button></div></header>

    <template v-if="currentView==='shelf'">
      <section class="library-hero">
        <div class="hero-copy"><span class="eyebrow">A LITTLE INSPIRATION, A NEW WORLD.</span><h1>让灵感，<em>落成故事。</em></h1><p>搭建一个世界，邂逅一个角色。<br>把脑海里的万千可能，写成属于你的篇章。</p><div class="hero-actions"><button class="btn btn-primary" @click="openCreate"><icon name="plus" size="16"></icon>新建作品</button><button class="btn btn-secondary" @click="openRoleplay">进入角色扮演<icon name="arrow" size="15"></icon></button></div></div>
        <div class="hero-art" aria-hidden="true"><div class="art-orbit"></div><div class="art-book back"></div><div class="art-book front"></div><span class="art-spark"><icon name="spark" size="25"></icon></span><span class="art-spark small"><icon name="spark" size="25"></icon></span><span class="art-caption">WHERE STORIES BEGIN</span></div>
      </section>
      <div class="library-stats"><div class="stat-card"><div class="stat-icon"><icon name="book" size="21"></icon></div><div><strong>{{ novels.length }}</strong><span>我的作品</span></div></div><div class="stat-card"><div class="stat-icon"><icon name="feather" size="21"></icon></div><div><strong>{{ shelfStats.chapters }}</strong><span>已完成章节</span></div></div><div class="stat-card"><div class="stat-icon"><icon name="spark" size="21"></icon></div><div><strong>{{ shelfStats.active }}</strong><span>正在创作</span></div></div></div>
      <div class="library-heading"><h2>我的作品<span>{{ novels.length }} 部故事，等待续写</span></h2><div class="library-controls"><div class="library-search"><icon name="search"></icon><input v-model="shelfQuery" aria-label="搜索作品" placeholder="搜索书名、题材、风格…"/></div><select v-model="shelfSort" class="library-sort" aria-label="作品排序"><option value="recent">最近更新</option><option value="title">按书名</option><option value="progress">按章节数</option></select></div></div>
      <div class="library-filters" aria-label="作品筛选"><button class="filter-chip" :class="{active:shelfFilter==='all'}" @click="shelfFilter='all'">全部作品</button><button class="filter-chip" :class="{active:shelfFilter==='active'}" @click="shelfFilter='active'">创作中</button><button class="filter-chip" :class="{active:shelfFilter==='draft'}" @click="shelfFilter='draft'">待开篇</button></div>

      <div v-if="loading.shelf && novels.length===0" class="text-center mt-24"><div class="spinner"></div><p class="color-text2 mt-8 text-xs">加载中…</p></div>

      <div v-else-if="novels.length===0 && !loading.shelf" class="empty">
        <div class="empty-icon">{{ shelfLoadFailed ? '⚠️' : '📚' }}</div>
        <h3>{{ shelfLoadFailed ? '加载失败' : '书架空空' }}</h3>
        <p>{{ shelfLoadFailed ? '服务器暂未就绪，请稍后重试' : '种下一颗灵感，开启你的第一部作品' }}</p>
        <button class="btn btn-primary" @click="openCreate" v-if="!shelfLoadFailed">开始创作</button>
        <button class="btn btn-primary" @click="loadShelf(); shelfLoadFailed=false" v-if="shelfLoadFailed">🔄 重新加载</button>
        <button class="btn btn-ghost mt-8" @click="loadShelf" style="font-size:12px" v-if="!shelfLoadFailed">🔄 重新加载</button>
      </div>

      <div v-else class="shelf-grid">
        <div v-for="(n, ni) in filteredNovels" :key="n.id" class="book-card" style="position:relative" role="button" tabindex="0" @click="openNovel(n)" @keydown.enter.self="openNovel(n)">
          <button class="book-delete" @click.stop="deleteNovel(n)" title="删除此书" aria-label="删除此书"><icon name="close" size="13"></icon></button>
          <button class="book-outline" @click.stop="openOutlineFor(n)" title="编辑大纲" aria-label="编辑大纲"><icon name="edit" size="12"></icon></button>
          <div class="book-cover" :style="{background:coverGradient(n.id)}"><div class="book-cover-top"><span>{{ n.genre || '原创故事' }}</span><span>NO. {{ String(ni+1).padStart(2,'0') }}</span></div><div class="book-cover-title">{{ n.title.slice(0,14) }}</div><div class="book-cover-bottom">AN ORIGINAL STORY · 墨局</div></div>
          <div class="book-info">
            <h3>{{ n.title }}</h3>
            <div class="meta">
              <span class="tag">{{ n.genre }}</span>
              <span class="tag">{{ n.style }}</span>
              <span class="badge" :class="(n.state.completed_chapters||[]).length?'badge-ok':'badge-warn'">{{ (n.state.completed_chapters||[]).length }}/{{ n.state.total_chapters }}</span>
            </div>
          </div>
          <div class="book-progress">
            <div class="progress-bar"><div class="progress-fill" :style="{width:pct(n)}"></div></div>
            <span class="progress-text">{{ pct(n) }}</span>
          </div>
        </div>
        <div v-if="!filteredNovels.length" class="library-no-results">没有找到匹配的作品，试试其他关键词。</div>
        <button class="book-card book-add" @click="openCreate"><span class="book-add-circle"><icon name="plus" size="23"></icon></span><strong>开始一个新故事</strong><small>你的下一个世界，从这里开始</small></button>
      </div>
    </template>

    <template v-if="currentView==='create'">
      <div class="main-header">
        <h2>新作品</h2>
        <div class="sub">选择模式开始创作</div>
      </div>

      <div class="card" :style="{border:'2px solid '+ (xhsMode ? 'var(--accent)' : 'var(--border)'), background: xhsMode ? 'linear-gradient(135deg, rgba(233,69,96,.08), rgba(255,107,107,.04))' : ''}">
        <div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer" @click="xhsMode=!xhsMode">
          <div>
            <div style="font-size:16px;font-weight:700;color:var(--accent)">📕 小红书爆款短篇</div>
            <div style="font-size:12px;color:var(--text2);margin-top:2px">8000-10000字，女频爽文，一键生成完整短篇 + 爆款标题</div>
          </div>
          <div style="font-size:24px;color:var(--text2);transition:transform .2s" :style="{transform:xhsMode?'rotate(90deg)':''}">▶</div>
        </div>
        <template v-if="xhsMode">
          <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
            <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px">选择模板</div>
            <div class="xhs-tpl-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px">
              <button v-for="t in xhsTemplates" :key="t.key"
                class="btn" :class="xhsTemplate===t.key?'btn-primary':'btn-secondary'"
                style="font-size:11px;padding:8px 6px;text-align:center"
                @click="xhsTemplate=t.key; loadXhsPresets()">
                <div style="font-size:16px">{{ t.emoji }}</div>
                <div style="margin-top:2px">{{ t.label }}</div>
                <div style="font-size:9px;opacity:.5">{{ t.target_words }}字</div>
              </button>
            </div>
            <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px">预设剧情（点一下就能生成）</div>
            <div v-if="xhsPresets.length>0" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:10px;max-height:180px;overflow-y:auto">
              <div v-for="p in xhsPresets" :key="p.id"
                class="btn" :class="xhsPreset?.id===p.id?'btn-primary':'btn-secondary'"
                style="font-size:11px;padding:8px;text-align:left;cursor:pointer"
                @click="xhsPreset=p; xhsInspiration=''">
                <div style="font-weight:600">{{ p.emoji }} {{ p.label }}</div>
                <div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:4px">
                  <span v-for="t in p.tags" style="font-size:9px;background:var(--bg2);color:var(--text2);padding:1px 5px;border-radius:8px">{{ t }}</span>
                </div>
              </div>
            </div>
            <div v-if="xhsPreset" style="margin-bottom:10px;padding:8px 10px;background:var(--bg2);border-radius:6px;font-size:12px;color:var(--text2)">
              📝 <b>{{ xhsPreset.label }}</b>：{{ xhsPreset.inspiration.slice(0,100) }}…
            </div>
            <div class="flex gap-8" style="margin-bottom:10px" v-if="!xhsPreset">
              <input v-model="xhsInspiration" placeholder="或手动输入你的灵感…" style="font-size:12px;flex:1">
            </div>
            <button class="btn" style="width:100%;padding:12px;background:linear-gradient(135deg,#e94560,#ff6b6b);color:#fff;border:none;font-size:15px;font-weight:600"
              @click="doXhsCreate" :disabled="loading.create || loading.xhs || (!xhsPreset && !xhsInspiration.trim())">
              {{ loading.xhs ? '⏳ 生成中…' : '⚡ 一键生成短篇 + 爆款标题' }}
            </button>
            <div v-if="loading.xhs" style="margin-top:12px">
              <div style="height:6px;background:var(--bg2);border-radius:3px;overflow:hidden">
                <div :style="{width:xhsProgress+'%',height:'100%',background:'linear-gradient(90deg,#e94560,#ff6b6b)',transition:'width .3s'}"></div>
              </div>
              <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--text2)">
                <span>{{ xhsPhase || '准备中…' }}</span><span>{{ xhsProgress }}%</span>
              </div>
              <div v-if="xhsStreamText" style="margin-top:8px;padding:8px;background:var(--bg2);border-radius:6px;font-size:11px;color:var(--text2);max-height:120px;overflow-y:auto;white-space:pre-wrap;line-height:1.5">{{ xhsStreamText.slice(-500) }}</div>
            </div>
            <div v-if="xhsResult" style="margin-top:16px;padding:12px;background:var(--bg2);border-radius:8px;font-size:12px">
              <div style="color:var(--gold);margin-bottom:6px">✅ 生成完成 · {{ xhsResult.total_words }}字 · {{ xhsResult.chapters.length }}章</div>
              <div style="color:var(--text2);margin-bottom:6px">📝 推荐标题（点击复制）：</div>
              <div v-for="(t,i) in xhsResult.titles" :key="i" style="padding:4px 0;color:var(--text);border-bottom:1px solid var(--border);cursor:pointer" @click="navigator.clipboard.writeText(t);showToast('标题已复制','','✅')">
                {{ i+1 }}. {{ t }}
              </div>
              <div class="flex gap-8 mt-8">
                <span class="btn btn-primary btn-sm" style="cursor:pointer" @click="openNovel({id: xhsResult.novel_id, title: xhsResult.plan?.title, state: {completed_chapters: xhsResult.chapters.map(c=>c.number), total_chapters: 4, total_words: xhsResult.total_words}})">去书架写作</span>
              </div>
            </div>
          </div>
        </template>
      </div>

      <div class="card" style="margin-top:16px">
        <div style="font-size:14px;font-weight:600;color:var(--text2);margin-bottom:12px">📖 长篇模式 · 自定义创作</div>
        <div class="form-row">
          <div class="form-group"><label>题材</label><select v-model="form.genre"><option v-for="g in genres" :value="g">{{ g }}</option></select></div>
          <div class="form-group"><label>目标字数</label><select v-model="form.target_words"><option :value="10000">1万字</option><option :value="50000">5万字</option><option :value="100000">10万字</option><option :value="150000">15万字</option><option :value="200000">20万字</option><option :value="300000">30万字</option></select></div>
        </div>
        <div class="form-group"><label>书名（留空自动生成）</label><input v-model="form.title" placeholder="我在修真界写代码"></div>
        <div class="form-group"><label>核心灵感</label><textarea v-model="form.inspiration" rows="3" placeholder="用几句话描述你的故事创意，越具体效果越好…"></textarea></div>

        <div class="flex items-center gap-6 mt-8" style="font-size:13px;color:var(--text2)">
          <label class="toggle-switch">
            <input type="checkbox" v-model="form.naturalNames">
            <span class="toggle-slider"></span>
          </label>
          <span>自然命名 <span style="opacity:.55">（禁用"云星辰叶尘无极天帝"等AI高频词）</span></span>
        </div>

        <div class="flex items-center gap-8 mt-8" style="font-size:13px;color:var(--text2)">
          <label class="toggle-switch">
            <input type="checkbox" v-model="form.normalPacing">
            <span class="toggle-slider"></span>
          </label>
          <span>
            <span v-if="!form.normalPacing">⚡ 快节奏 <span style="opacity:.5">— 短平快，冲突密集，进展迅速</span></span>
            <span v-else>📖 正常节奏 <span style="opacity:.5">— 铺陈充分，张弛有度，细节丰富</span></span>
          </span>
        </div>

        <div class="flex items-center gap-8 mt-8" style="font-size:13px;color:var(--text2)">
          <label class="toggle-switch">
            <input type="checkbox" v-model="form.creativeEnhance">
            <span class="toggle-slider"></span>
          </label>
          <span>
            <span v-if="form.creativeEnhance">🎲 创意加成 <span style="opacity:.55">— 允许AI注入反套路脑洞（随机创意约束）</span></span>
            <span v-else style="opacity:.55">🎲 创意加成 <span style="opacity:.4">— 默认关：严格按你的需求写，不加任何私货</span></span>
          </span>
        </div>

        <div class="flex items-center gap-8 mt-6" v-if="!form.normalPacing">
          <label class="toggle">
            <input type="checkbox" v-model="form.fastFood">
            <span class="toggle-slider"></span>
          </label>
          <span>
            <span v-if="form.fastFood">🍔 快餐模式 <span style="opacity:.5">— 对标爆款网文：300字炸开、每章4爽点、虐不过2章、0铺垫</span></span>
            <span v-else style="opacity:.5">→ 勾选开启爆款节奏</span>
          </span>
        </div>
      </div>

      <div class="card">
        <div class="flex justify-between items-center" style="margin-bottom:16px">
          <div class="card-title" style="margin:0">风格</div>
          <div class="flex gap-6">
            <button class="btn btn-xs" :class="styleMode==='library'?'btn-primary':'btn-ghost'" @click="styleMode='library'">风格库</button>
            <button class="btn btn-xs" :class="styleMode==='params'?'btn-primary':'btn-ghost'" @click="styleMode='params';loadStyleParams()">参数化</button>
            <button class="btn btn-xs" :class="styleMode==='custom'?'btn-primary':'btn-ghost'" @click="styleMode='custom'">自由描述</button>
          </div>
        </div>

        <template v-if="styleMode==='library'">
          <template v-for="(authors, cat) in styleCategories">
            <div class="style-cat-title">{{ cat }}</div>
            <div class="style-grid">
              <div v-for="s in authors" :key="s.name" class="style-card" :class="{active:form.style===s.name}" @click="form.style=s.name">
                <div class="sc-name">{{ s.name }}</div>
                <div class="sc-author">{{ s.author }}</div>
                <div class="sc-desc" v-if="s.desc">{{ s.desc }}</div>
              </div>
            </div>
          </template>
        </template>

        <div v-if="styleMode==='params'" class="param-panel">
          <div class="param-hint">选择各维度参数，AI 将据此生成精准匹配的风格。</div>
          <div v-for="(cfg, key) in styleParams" :key="key" class="param-group">
            <div class="param-label">{{ cfg.label }}</div>
            <div class="param-options">
              <button v-for="opt in cfg.options" :key="opt.value"
                class="param-btn"
                :class="{active:customParams[key]===opt.value}"
                @click="customParams[key]=opt.value">
                {{ opt.label }}
              </button>
            </div>
          </div>
          <div class="param-group">
            <div class="param-label">额外关键词</div>
            <input v-model="customParams.keyword" placeholder="如：赛博朋克背景 / 带点王小波式的黑色幽默…" style="width:100%">
          </div>
          <button class="btn btn-primary w-full mt-12" @click="applyParamStyle" :disabled="isBusy">
            {{ form.style==='自定义参数化风格' ? '✓ 已应用参数化风格' : '应用参数化风格' }}
          </button>
        </div>

        <div v-if="styleMode==='custom'" class="mt-8">
          <textarea v-model="customStyleDesc" rows="3" placeholder="描述你想要的文笔风格…&#10;&#10;如：王小波的黑色幽默 + 村上春树的孤独感 + 中国武侠的江湖气。&#10;对话要冷幽默，描写有画面感不啰嗦，节奏快但不乱…"></textarea>
          <div class="flex gap-8 mt-8">
            <button class="btn btn-secondary btn-sm flex-1" @click="applyCustomStyle" :disabled="!customStyleDesc.trim()">{{ form.style.startsWith('自定义') && !form.style.includes('参数化') ? '✓ 已应用' : '应用此风格' }}</button>
            <button class="btn btn-ghost btn-sm" @click="saveStyleSeed" :disabled="!customStyleDesc.trim()">保存种子</button>
          </div>
          <div v-if="styleSeeds.length>0" class="mt-12">
            <div class="style-cat-title">已保存的种子</div>
            <div class="flex gap-6 flex-wrap">
              <span v-for="s in styleSeeds" :key="s.name" class="tag" style="cursor:pointer" @click="loadStyleSeed(s)">{{ s.name }}<span style="opacity:.4;margin-left:4px;cursor:pointer" @click.stop="deleteStyleSeed(s)">×</span></span>
            </div>
          </div>
        </div>
      </div>

      <div v-if="error" class="error-msg" style="cursor:pointer" @click="error=''">{{ error }} <span style="float:right;opacity:.5">✕</span></div>

      <div v-if="loading.create" class="create-progress">
        <div class="cp-bar"><div class="cp-fill" :style="{width:createProgress+'%'}"></div></div>
        <div class="cp-info"><span class="cp-label">{{ createPhaseLabel }}</span><span class="cp-pct">{{ createProgress }}%</span></div>
      </div>
      <button v-else class="btn btn-primary w-full" style="padding:12px;font-size:15px" @click="doCreate">
        生成大纲
      </button>

      <div v-if="decomposeSummary" class="card" style="margin-top:12px;background:var(--bg2);border-color:var(--accent)">
        <div class="card-title" style="color:var(--accent);display:flex;align-items:center;justify-content:space-between">
          <span>📋 需求分析结果</span>
          <span style="font-size:12px;font-weight:400;color:var(--text3)">
            {{ decomposeSummary.p0_count || 0 }}个P0 · 共{{ decomposeSummary.subtask_count || 0 }}项
          </span>
        </div>
        <div style="font-size:13px;color:var(--text2);line-height:1.6">
          <div v-if="decomposeSummary.core_theme"><b>核心主题：</b>{{ decomposeSummary.core_theme }}</div>

                <div v-if="sgCalibration.character_issues?.length" class="sg-calib-section">
                  <div class="text-xs font-semibold mb-4" style="color:var(--purple)">👤 角色问题</div>
                  <div v-for="(ci,i) in sgCalibration.character_issues" :key="'ci'+i" class="sg-calib-item" style="border-left-color:#7c3aed">

            <div v-if="sgSubTab==='relations'">
              <div v-if="!relationGraph.nodes.length" class="text-center" style="padding:40px;color:var(--text3)">

                <p class="text-sm">暂无角色关系数据，请先生成章节</p>
              </div>
              <div v-else class="sg-relation-container">
                <div class="sg-legend">
                  <span class="text-xs color-text3" style="font-weight:600">图例</span>
                  <span class="sg-legend-item"><span class="sg-legend-dot" style="background:var(--accent);box-shadow:0 0 6px var(--accent)"></span> 关系变化</span>
                  <span class="sg-legend-item"><span style="display:inline-block;width:12px;border-top:1.5px dashed var(--accent);opacity:.6;vertical-align:middle;margin-right:4px"></span> 剧情共线</span>
                  <span class="text-xs color-text3" style="margin-left:auto">拖拽节点 · 滚轮缩放</span>
                </div>
                <div class="sg-relation-svg-wrap" ref="relationSvgWrap" :style="{height:relationHeight+'px'}">
                  <svg :viewBox="`0 0 ${relationViewBox.w} ${relationViewBox.h}`"
                       class="sg-relation-svg"
                       @wheel.prevent="zoomRelation"
                       @mousedown="startPanRelation"
                       @mousemove="doPanRelation"
                       @mouseup="endPanRelation"
                       @mouseleave="endPanRelation">
                    <defs>

                      <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
                        <circle cx="15" cy="15" r="0.8" fill="var(--border)" opacity="0.3"/>
                      </pattern>

                      <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
                        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                      </filter>
                      <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
                        <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
                        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                      </filter>
                      <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
                        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
                      </filter>

                      <radialGradient v-for="(node, i) in relationGraph.nodes" :key="'grad'+i" :id="'grad'+i" cx="40%" cy="35%">
                        <stop offset="0%" :stop-color="node.glowColor"/>
                        <stop offset="100%" :stop-color="node.color"/>
                      </radialGradient>

                      <linearGradient id="edgeGradSolid" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.6"/>
                        <stop offset="50%" stop-color="var(--accent)" stop-opacity="0.9"/>
                        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.6"/>
                      </linearGradient>
                      <linearGradient id="edgeGradDash" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.25"/>
                        <stop offset="50%" stop-color="var(--accent)" stop-opacity="0.5"/>
                        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.25"/>
                      </linearGradient>
                    </defs>

                    <rect width="100%" height="100%" fill="url(#dotGrid)"/>

                    <path v-for="(edge, i) in relationEdges" :key="'e'+i"
                          :d="edgeCurve(edge)"
                          :stroke="edge.dashed ? 'url(#edgeGradDash)' : 'url(#edgeGradSolid)'"
                          :stroke-width="edge.dashed ? 1.2 : 2"
                          :stroke-dasharray="edge.dashed?'6,4':'none'"
                          fill="none"
                          :opacity="sgHoveredEdge===i ? 1 : sgHoveredChar && sgHoveredChar!==edge.source && sgHoveredChar!==edge.target ? 0.08 : 0.55"
                          class="sg-edge-line"
                          @mouseenter="sgHoveredEdge=i" @mouseleave="sgHoveredEdge=null"/>

                    <g v-for="(edge, i) in relationEdges" :key="'elg'+i"
                       :opacity="sgHoveredEdge===i ? 1 : 0"
                       style="transition:opacity .2s">
                      <rect :x="(edge.x1+edge.x2)/2-20" :y="edgeCurveMid(edge).y-12" width="40" height="16" rx="4"
                            fill="var(--bg)" stroke="var(--border)" stroke-width="0.5"/>
                      <text :x="(edge.x1+edge.x2)/2" :y="edgeCurveMid(edge).y"
                            class="edge-label" style="font-size:9px">{{ edge.label?.substring(0,6) }}</text>
                    </g>

                    <g v-for="(node, i) in relationNodes" :key="'n'+i"
                       :transform="`translate(${node.x},${node.y})`"
                       :style="`cursor:${relationDragging===i?'grabbing':'grab'}`"
                       @mousedown.stop="startDragRelationNode(i, $event)"
                       @mouseenter="sgHoveredChar=node.id"
                       @mouseleave="sgHoveredChar=null"
                       class="sg-glow-node">

                      <circle :r="node.radius" fill="#000" opacity="0.15"
                              :transform="`translate(0,${node.radius*0.08})`"
                              :filter="sgHoveredChar===node.id ? 'url(#dropShadow)' : 'none'"/>

                      <circle :r="node.radius" :fill="`url(#grad${node.gradIndex})`"
                              :filter="sgHoveredChar===node.id ? 'url(#glowStrong)' : 'none'"/>

                      <circle :r="node.radius - 3" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

                      <text text-anchor="middle" dy="-2" font-size="13" font-weight="700" fill="#fff"
                            style="text-shadow:0 1px 3px rgba(0,0,0,.3)">{{ node.label?.substring(0,4) }}</text>

                      <circle :r="3" :cx="node.radius-6" :cy="-node.radius+6"
                              :fill="node.last_chapter >= lastActiveChapter ? '#3fb950' : '#8b949e'"
                              :opacity="node.last_chapter >= lastActiveChapter ? 1 : 0.4"/>

                      <text v-if="node.emotionIcon" text-anchor="middle" dy="14" font-size="12"
                            :opacity="sgHoveredChar===node.id ? 1 : 0.5" style="transition:opacity .2s">
                        {{ node.emotionIcon }}
                      </text>
                    </g>
                  </svg>
                </div>

                <div v-if="sgHoveredChar && hoveredCharDetail" class="sg-char-tooltip">
                  <div class="tt-name">
                    <span class="tt-dot" :style="{background:hoveredCharDetail.color}"></span>
                    {{ hoveredCharDetail.label }}
                  </div>
                  <div v-if="hoveredCharDetail.emotion" class="text-xs" style="color:var(--text2);margin-bottom:6px">{{ hoveredCharDetail.emotionIcon }} {{ hoveredCharDetail.emotion }}</div>
                  <div v-if="hoveredCharDetail.location" class="text-xs color-text3">📍 {{ hoveredCharDetail.location }}</div>
                  <div v-if="hoveredCharDetail.power_level" class="text-xs color-text3">⚡ {{ hoveredCharDetail.power_level }}</div>
                  <div v-if="hoveredCharDetail.goals?.length" class="text-xs color-text2 mt-2" style="line-height:1.6">🎯 {{ hoveredCharDetail.goals.join(' · ') }}</div>
                  <div v-if="hoveredCharDetail.last_chapter" class="text-xs color-text3 mt-2">最近出场: Ch{{ hoveredCharDetail.last_chapter }}</div>
                </div>

                <div class="sg-resize-handle" @mousedown="startResize('relation', $event)" title="拖拽调整高度"></div>
              </div>
            </div>

            <div v-if="sgSubTab==='timeline'">
              <div v-if="!plotTimeline.lanes?.length" class="text-center" style="padding:40px;color:var(--text3)">
                <div style="font-size:36px;margin-bottom:8px">📈</div>
                <p class="text-sm">暂无剧情线数据，请先生成章节</p>
              </div>
              <div v-else class="sg-timeline-container">
                <div class="sg-legend">
                  <span class="text-xs color-text3" style="font-weight:600">图例</span>
                  <span class="sg-legend-item"><span class="sg-legend-dot" style="background:#f85149;box-shadow:0 0 6px #f85149"></span> 主线</span>
                  <span class="sg-legend-item"><span class="sg-legend-dot" style="background:#f59e0b;box-shadow:0 0 6px #f59e0b"></span> 支线</span>
                  <span class="sg-legend-item"><span class="sg-legend-dot" style="background:#8b5cf6;box-shadow:0 0 6px #8b5cf6"></span> 角色弧</span>
                  <span class="sg-legend-item"><span class="sg-legend-dot" style="background:#06b6d4;box-shadow:0 0 6px #06b6d4"></span> 悬疑</span>
                  <span style="margin-left:12px;width:1px;height:14px;background:var(--border)"></span>
                  <span class="sg-legend-item"><span class="sg-legend-dot" style="background:#3fb950"></span> 低</span>
                  <span class="sg-legend-item"><span class="sg-legend-dot" style="background:#f0883e"></span> 中</span>
                  <span class="sg-legend-item"><span class="sg-legend-dot" style="background:#f85149"></span> 高</span>
                  <span class="text-xs color-text3">紧张度</span>
                  <span class="text-xs color-text3" style="margin-left:auto">滚轮缩放 · 拖拽平移</span>
                </div>
                <div class="sg-timeline-svg-wrap" ref="timelineSvgWrap" :style="{height:timelineHeight+'px'}">
                  <svg :viewBox="`0 0 ${timelineViewBox.w} ${timelineViewBox.h}`"
                       class="sg-timeline-svg"
                       @wheel.prevent="zoomTimeline"
                       @mousedown="startPanTimeline"
                       @mousemove="doPanTimeline"
                       @mouseup="endPanTimeline"
                       @mouseleave="endPanTimeline">
                    <defs>
                      <filter id="glowStrong">
                        <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
                        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                      </filter>
                    </defs>

                    <g>
                      <rect x="0" y="0" :width="timelineViewBox.w" height="28" fill="var(--bg)" opacity="0.85"/>
                      <line x1="0" y1="28" :x2="timelineViewBox.w" y2="28" stroke="var(--border)" stroke-width="1"/>
                      <text v-for="ch in timelineChapterLabels" :key="'chl'+ch"
                            :x="chToX(ch)" y="20" text-anchor="middle" font-size="11" font-weight="700"
                            :fill="ch % 10 === 0 ? 'var(--accent)' : 'var(--text3)'">
                        Ch{{ ch }}
                      </text>
                    </g>

                    <g v-for="(lane, i) in plotTimeline.lanes" :key="'lg'+i">

                      <rect x="0" :y="laneY(i)" :width="timelineViewBox.w" height="60" rx="4"
                            :fill="lane.color" fill-opacity="0.04"
                            :stroke="lane.color" stroke-opacity="0.1" stroke-width="1"/>

                      <g :transform="`translate(4, ${laneY(i)+18})`">
                        <rect x="0" y="-14" width="18" height="18" rx="4" :fill="lane.color" opacity="0.25"/>
                        <text x="9" y="-1" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">P{{ lane.priority }}</text>
                        <text x="24" y="-1" font-size="13" :fill="lane.color" font-weight="700" dominant-baseline="middle">{{ lane.name?.substring(0,14) }}</text>
                      </g>

                      <line x1="0" :y1="laneY(i)+40" :x2="timelineViewBox.w" :y2="laneY(i)+40"
                            :stroke="lane.color" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4,8"/>

                      <g v-for="(ev, ei) in lane.events" :key="'ev'+ei"
                         :transform="`translate(${chToX(ev.chapter)}, ${laneY(i)+40})`"
                         class="sg-timeline-event-dot"
                         @mouseenter="sgHoveredEvent={lane:i, idx:ei}"
                         @mouseleave="sgHoveredEvent=null">
                        <circle r="5.5" :fill="tensionGradient(ev.tension||5)" :stroke="lane.color" stroke-width="2"/>
                        <circle r="9" fill="none" :stroke="lane.color" stroke-width="1" opacity="0" style="transition:all .15s"/>
                      </g>
                    </g>
                  </svg>
                </div>

                <div v-if="sgHoveredEvent && hoveredEventDetail" class="sg-event-tooltip">
                  <div style="font-size:13px;font-weight:700;margin-bottom:6px" :style="{color:plotTimeline.lanes[sgHoveredEvent.lane]?.color}">
                    {{ plotTimeline.lanes[sgHoveredEvent.lane]?.name }}
                  </div>
                  <div class="text-xs color-text3">📖 第{{ hoveredEventDetail.chapter }}章</div>
                  <div class="text-xs color-text2 mt-2" style="line-height:1.5">{{ hoveredEventDetail.event }}</div>
                  <div class="text-xs mt-2" style="display:flex;align-items:center;gap:2px">
                    <span class="tt-tension-dot" :style="{background:tensionGradient(hoveredEventDetail.tension||5)}"></span>
                    <span :style="{color:tensionGradient(hoveredEventDetail.tension||5)}">
                      紧张度 {{ hoveredEventDetail.tension||5 }}/10
                    </span>
                  </div>
                </div>

                <div class="sg-resize-handle" @mousedown="startResize('timeline', $event)" title="拖拽调整高度"></div>
              </div>
            </div>

            <div v-if="sgSubTab==='canvas'">
              <div v-if="!plotTimeline.lanes?.length" class="text-center" style="padding:40px;color:var(--text3)">
                <div style="font-size:36px;margin-bottom:8px">🎨</div>
                <p class="text-sm">暂无剧情线数据，请先生成章节</p>
              </div>

                   @click="hideCanvasMenu"
                   @wheel.prevent="zoomCanvas"
                   @mousedown="startCanvasPan"
                   @mousemove="doCanvasPan"
                   @mouseup="endCanvasPan"
                   @mouseleave="endCanvasPan"
                   @contextmenu.prevent>
                <div class="sg-canvas-inner" ref="canvasInner" :style="{transform:`translate(${canvasPan.x}px,${canvasPan.y}px) scale(${canvasZoom})`}">

                  <div class="sg-canvas-grid" :style="{width:canvasWidth+'px',height:canvasHeight+'px'}"></div>

                  <div class="sg-canvas-axis" :style="{width:canvasWidth+'px'}">
                    <div v-for="ch in canvasTickChapters" :key="'tick'+ch" class="axis-tick"
                         :class="{major: ch % 5 === 0}"
                         :style="{left:chToCanvasX(ch)+'px'}">Ch{{ ch }}</div>
                  </div>

                  <div v-for="(lane, li) in plotTimeline.lanes" :key="'clane'+li"
                       class="sg-canvas-lane"
                       :style="{top:(40+li*canvasLaneH)+'px',width:canvasWidth+'px'}">
                    <div class="sg-canvas-lane-label" :style="{color:lane.color}">
                      {{ {'main_plot':'🔴','subplot':'🟡','character_arc':'🟣','mystery':'🔵'}[lane.type]||'⚪' }}
                      {{ lane.name?.substring(0,14) }}
                      <span style="font-size:10px;opacity:.6">P{{ lane.priority }} · {{ lane.events.length }}事件</span>
                    </div>
                    <div class="sg-canvas-lane-line" :style="{borderColor:lane.color}"></div>

                    <div v-for="gap in getLaneGaps(li)" :key="'gap'+li+'-'+gap.from"
                         class="sg-gap-warn"
                         :style="{left:chToCanvasX(gap.mid)+'px',top:'28px'}"
                         @click.stop="addEventAtGap(li, gap.mid)">
                      ⚠️ {{ gap.chapters }}章无进展
                    </div>

                    <div v-for="(ev, ei) in lane.events" :key="'ccard'+ei"
                         class="sg-card"
                         :class="{selected:canvasSelected===lane.id+':'+ei, dragging:canvasDragging===lane.id+':'+ei}"
                         :style="{left:(chToCanvasX(ev.chapter)-74)+'px',top:'22px',borderLeftColor:lane.color,borderLeftWidth:'3px'}"
                         @mousedown.stop="startDragCanvasNode($event, li, ei)"
                         @click.stop="canvasSelected=lane.id+':'+ei"
                         @contextmenu.prevent.stop="showCanvasMenu($event, li, ei)">

                      <div class="sg-card-handle" title="拖拽创建关联"
                           @mousedown.stop="startCanvasConnect($event, li, ei)"></div>

                      <div class="sg-card-header">
                        <span class="sg-card-ch">Ch{{ ev.chapter }}</span>
                        <span class="sg-card-priority" :style="{background:lane.color+'20',color:lane.color}">
                          P{{ lane.priority }}
                        </span>
                      </div>

                      <div class="sg-card-body" :title="ev.event">{{ ev.event?.substring(0,20) }}</div>

                      <div class="sg-card-tension" :style="{width:(ev.tension||5)*10+'%',background:tensionColor(ev.tension)}"></div>

                      <div class="sg-card-chars" v-if="lane.characters?.length">
                        <span v-for="c in lane.characters.slice(0,4)" :key="c" class="sg-card-char">👤{{ c.substring(0,2) }}</span>
                      </div>
                    </div>
                  </div>
                </div>

                <div v-if="canvasDragging" class="sg-drag-preview" :style="{left:canvasDragX+'px',top:canvasDragY-30+'px'}">
                  Ch{{ canvasDragCh }} · 紧张度 {{ canvasDragTension }}
                </div>

                <div v-if="canvasToast" class="sg-canvas-toast">{{ canvasToast }}</div>

                <div v-if="canvasMenu.show" class="sg-context-menu" :style="{left:canvasMenu.x+'px',top:canvasMenu.y+'px'}" @click.stop>
                  <div class="menu-item" @click="canvasMenuAction('edit')">✏️ 编辑事件</div>
                  <div class="menu-item" @click="canvasMenuAction('heat')">🔥 升温 +2</div>
                  <div class="menu-item" @click="canvasMenuAction('cool')">❄️ 降温 -2</div>
                  <div class="menu-item" @click="canvasMenuAction('addAfter')">➕ 在后面新增</div>
                  <div class="menu-divider"></div>
                  <div class="menu-item danger" @click="canvasMenuAction('delete')">🗑️ 删除</div>
                </div>
              </div>
            </div>

            <div v-if="!sgCalibration && !sgThreads.length && sgSubTab==='overview'" class="text-center" style="padding:40px;color:var(--text3)">
              <div style="font-size:36px;margin-bottom:12px">🔍</div>
              <p>尚未生成章节，剧情图谱数据将在写作过程中自动构建</p>
            </div>
          </div>
        </div>
      </div>
    </template>

    <template v-if="currentView==='export'">
      <div class="main-header">
        <h2>导出</h2>
        <div class="sub">{{ novels.length }} 部作品 · {{ isAndroid ? '单本或批量导出 TXT' : '单本或批量导出 TXT / PDF / EPUB' }}</div>
      </div>

      <div class="card">
        <div class="export-list">
          <div v-for="n in novels" :key="n.id" class="export-item">
            <div class="export-check" :class="{checked:exportSelected[n.id]}" @click="toggleExport(n.id)"></div>
            <div class="ei-info">
              <div class="ei-title">{{ n.title }}</div>
              <div class="ei-meta">{{ n.genre }} · {{ n.style }} · {{ (n.state.completed_chapters||[]).length }}/{{ n.state.total_chapters }}章</div>
            </div>
            <div class="ei-actions">
              <button class="btn btn-ghost btn-xs" @click="doSingleExport(n,'txt')" :disabled="loading.export===n.id+'txt'">{{ loading.export===n.id+'txt' ? '…' : 'TXT' }}</button>
              <button v-if="!isAndroid" class="btn btn-ghost btn-xs" @click="doSingleExport(n,'pdf')" :disabled="loading.export===n.id+'pdf'">{{ loading.export===n.id+'pdf' ? '…' : 'PDF' }}</button>
              <button v-if="!isAndroid" class="btn btn-ghost btn-xs" @click="doSingleExport(n,'epub')" :disabled="loading.export===n.id+'epub'">{{ loading.export===n.id+'epub' ? '…' : 'EPUB' }}</button>
            </div>
          </div>
        </div>

        <div v-if="novels.length===0" class="text-center color-text3 text-sm" style="padding:30px">还没有小说</div>

        <div class="export-actions" v-if="selectedCount>0">
          <button class="btn btn-secondary flex-1" @click="doBatchExport()" :disabled="loading.export">
            <span v-if="loading.export==='batch'"><span class="spinner"></span></span>
            批量下载 ({{ selectedCount }}本)
          </button>
        </div>
        <div v-if="loading.export==='batch'" style="margin-top:8px">
          <div class="progress-bar"><div class="progress-fill" :style="{width:exportProgress+'%'}"></div></div>
        </div>
        <button class="btn btn-ghost btn-sm mt-8" @click="selectAll" v-if="novels.length">{{ allSelected ? '取消全选' : '全选' }}</button>
      </div>

      <div v-if="error" class="error-msg" style="cursor:pointer" @click="error=''">{{ error }} <span style="float:right;opacity:.5">✕</span></div>
    </template>
  </main>

  <nav class="bottom-nav" aria-label="移动端导航"><button class="bn-item" :class="{active:currentView==='shelf'}" @click="currentView='shelf'"><icon name="grid"></icon>书架</button><button class="bn-item" :class="{active:currentView==='create'}" @click="openCreate"><icon name="feather"></icon>创作</button><button class="bn-item" @click="openRoleplay"><icon name="mask"></icon>扮演</button><button class="bn-item" :class="{active:currentView==='export'}" @click="currentView='export'"><icon name="download"></icon>导出</button><button class="bn-item" @click="connectionOpen=true"><icon name="settings"></icon>设置</button></nav>
  <connection-dialog :open="connectionOpen" @close="connectionOpen=false"></connection-dialog>
</div>


</body>
</html>
